# fly.toml app configuration file generated for lazy-cent on 2026-10-06T19:59:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lazy-cent'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_URL = 'https://lazy-cent.fly.dev'
  DAYS_MAX_LOADED = '180'
  DEMO_ENABLED = 'false'
  PASSWORD_RESET_CLEANUP_CRON = '0 0 3 * * *'
  PORT = '8080'
  SESSION_COOKIE_SECURE = 'true'
  SPRING_DATASOURCE_URL = 'jdbc:h2:file:/app/data/lazycent;DB_CLOSE_ON_EXIT=FALSE'
  TRUST_FORWARDED_FOR = 'true'

[[mounts]]
  source = 'lazycent_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
