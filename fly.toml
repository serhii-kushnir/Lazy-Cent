app = "lazy-cent"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
APP_URL = "https://lazy-cent.fly.dev"
DEMO_ENABLED = "false"
SESSION_COOKIE_SECURE = "true"
TRUST_FORWARDED_FOR = "true"
DAYS_MAX_LOADED = "180"
PASSWORD_RESET_CLEANUP_CRON = "0 0 3 * * *"
SPRING_DATASOURCE_URL = "jdbc:h2:file:/app/data/lazycent;DB_CLOSE_ON_EXIT=FALSE"

# Volume для H2 — створиться окремою командою
[[mounts]]
source = "lazycent_data"
destination = "/app/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 200
hard_limit = 250

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512