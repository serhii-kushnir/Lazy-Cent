spring:
  # ===================== MESSAGES =====================
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ===================== APPLICATION =====================
  application:
    name: lazycent

  # ===================== DATASOURCE =====================
  datasource:
    url: jdbc:h2:file:./data/lazycent;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USER}
    password: ${DB_PASS}

  # ===================== FLYWAY =====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # ===================== JPA =====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===================== SECURITY / OAUTH2 =====================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  # ===================== MAIL =====================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_USERNAME}

# ===================== SERVER =====================
server:
  port: 8081

# ===================== APP =====================
app:
  demo:
    enabled: true
    default-user: demo
    default-password: demo
    random-days: 14
    new-user-days: 7
  rate-limit:
     trust-forwarded-for: true

# ===================== ACTUATOR =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true