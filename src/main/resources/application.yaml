spring:
  messages:
      basename: messages
      encoding: UTF-8
      fallback-to-system-locale: false
  application:
    name: lazycent
  datasource:
    url: jdbc:h2:file:./data/lazycent;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USER}
    password: ${DB_PASS}
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  # ===================== MAIL (SMTP) =====================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_USERNAME}

server:
  port: 8081

logging:
  level:
    org.lazycent: DEBUG
    org.lazycent.config.LocaleAwareAuthenticationSuccessHandler: DEBUG
app:
  demo:
    enabled: true
    default-user: demo
    default-password: demo
    random-days: 14
    new-user-days: 7