spring:
  # ===================== MESSAGES =====================
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ===================== APPLICATION =====================
  application:
    name: lazycent

  # ===================== DATASOURCE =====================
  datasource:
    url: jdbc:h2:file:./data/lazycent;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USER}
    password: ${DB_PASS}

  # ===================== FLYWAY =====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # ===================== JPA =====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===================== SECURITY / OAUTH2 =====================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  # ===================== MAIL =====================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_USERNAME}

# ===================== SERVER =====================
# ===================== SERVER =====================
server:
  port: 8080
  servlet:
    session:
      # 60 хвилин неактивності → сесія інвалідується.
      # Після цього — редірект на /login.
      timeout: 60m
      cookie:
        # Кастомне ім'я, щоб не світити стандартний JSESSIONID (security by obscurity,
        # але ускладнює fingerprinting).
        name: LAZYCENT_SESSION
        # Захист від XSS: JavaScript не бачить cookie з сесією.
        http-only: true
        # У продакшн — увімкнути (HTTPS-only). У dev з HTTP — вимкнути,
        # інакше cookie не буде передаватись і логін не працюватиме.
        secure: ${SESSION_COOKIE_SECURE:false}
        # Захист від CSRF через зовнішні сайти: cookie передається тільки
        # на same-site переходах top-level. Lax — безпечний дефолт.
        same-site: lax
        # Префікс шляху; / означає — для всього застосунку.
        path: /

# ===================== APP =====================
app:
  url: ${APP_URL:http://localhost:8080}
  days:
    max-loaded: ${DAYS_MAX_LOADED:180}
  demo:
    enabled: ${DEMO_ENABLED:false}
    default-user: ${DEMO_USER:demo}
    default-password: ${DEMO_PASSWORD:demo}
    random-days: ${DEMO_RANDOM_DAYS:14}
  rate-limit:
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  password-reset:
    # Cron для щоденного очищення прострочених токенів.
    # Формат: second minute hour day month weekday
    # Дефолт: щодня о 03:00.
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 0 3 * * *}

# ===================== ACTUATOR =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true