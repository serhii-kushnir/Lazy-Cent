spring:
  # ===================== MESSAGES =====================
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ===================== APPLICATION =====================
  application:
    name: lazycent

  # ===================== DATASOURCE =====================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lazycent;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    # Дефолти для локального запуску без env-змінних:
    #   H2 створює БД з user=sa і порожнім паролем.
    username: ${DB_USER:sa}
    password: ${DB_PASS:}

  # ===================== FLYWAY =====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # ===================== JPA =====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===================== SECURITY / OAUTH2 =====================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

  # ===================== MAIL =====================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:${MAIL_USERNAME}}

# ===================== SERVER =====================
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      # 60 хвилин неактивності → сесія інвалідується.
      timeout: 60m
      cookie:
        # Кастомне ім'я, щоб не світити стандартний JSESSIONID
        name: LAZYCENT_SESSION
        # Захист від XSS: JavaScript не бачить cookie з сесією.
        http-only: true
        # У продакшн — увімкнути (HTTPS-only).
        secure: ${SESSION_COOKIE_SECURE:false}
        # Захист від CSRF: cookie передається тільки на same-site переходах.
        same-site: lax
        path: /

# ===================== APP =====================
app:
  url: ${APP_URL:http://localhost:8080}
  days:
    max-loaded: ${DAYS_MAX_LOADED:180}
  demo:
    # Дефолт false — щоб випадковий деплой без DEMO_ENABLED не створив
    # юзера demo/demo. У application-test.yaml теж false.
    enabled: ${DEMO_ENABLED:false}
    default-user: ${DEMO_USER:demo}
    default-password: ${DEMO_PASSWORD:}
    random-days: ${DEMO_RANDOM_DAYS:14}
  # Уніфіковане property для reverse proxy.
  # Використовується RateLimitFilter і RedirectUtils.
  trust-proxy: ${TRUST_PROXY:false}
  password-reset:
    # Cron для щоденного очищення прострочених токенів.
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 0 3 * * *}
  logging:
    # Керує file-appenders у logback-spring.xml.
    # false (default) — логи тільки в stdout (підходить для Fly.io, Docker, Kubernetes).
    # true — додатково пише в ./logs/*.log (для локальної розробки).
    file:
      enabled: ${LOG_TO_FILE:false}

# ===================== ACTUATOR =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true