spring:
  # ===================== MESSAGES =====================
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ===================== APPLICATION =====================
  application:
    name: lazycent

  # ===================== h2 =====================
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # ===================== DATASOURCE =====================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lazycent;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASS:}

  # ===================== FLYWAY =====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # ===================== JPA =====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===================== SECURITY / OAUTH2 =====================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

  # ===================== MAIL =====================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:${MAIL_USERNAME}}

# ===================== SERVER =====================
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 60m
      cookie:
        name: LAZYCENT_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
        persistent: false

# ===================== LOGGING =====================
# P1.17: правильні Spring Boot logging levels (root-level, без префіксу "app.").
# Раніше було "app.logging.level.*" — Spring Boot це ігнорував.
# logback-spring.xml більше не перебиває ці рівні (прибрано <logger> для org.lazycent / org.hibernate.SQL).
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.lazycent: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:WARN}
    org.springframework.security: INFO

# ===================== APP =====================
app:
  url: ${APP_URL:http://localhost:8080}
  days:
    max-loaded: ${DAYS_MAX_LOADED:180}
  demo:
    enabled: ${DEMO_ENABLED:false}
    default-user: ${DEMO_USER:demo}
    default-password: ${DEMO_PASSWORD:}
    random-days: ${DEMO_RANDOM_DAYS:14}
  trust-proxy: ${TRUST_PROXY:false}
  password-reset:
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 0 3 * * *}
  logging:
    file:
      enabled: ${LOG_TO_FILE:false}

# ===================== ACTUATOR =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true