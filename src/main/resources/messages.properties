landing.hero.title.full=Lazy Cent Кожна копійка під контролем
landing.features.intro=Lazy Cent створений для того, щоб зробити процес контролю за фінансами максимально простим та швидким. Вам не потрібно вивчати складні інструкції чи витрачати години на налаштування. Інтерфейс інтуїтивно зрозумілий, а всі необхідні функції знаходяться під рукою. Ось основні можливості, які допоможуть вам досягти фінансової свободи. Кожна функція ретельно продумана, щоб заощадити ваш час і нерви.
landing.screenshots.intro=Інтерфейс Lazy Cent розроблений так, щоб ви могли керувати фінансами навіть на ходу. Завдяки адаптивному дизайну, всі екрани — від дашборду до налаштувань — однаково зручно виглядають як на великих моніторах, так і на смартфонах. Ви можете швидко додати витрату в магазині або переглянути тижневу аналітику вдома. Ось кілька скріншотів, які демонструють основні можливості застосунку.
landing.faq.intro=Ми зібрали найпопулярніші запитання, які виникають у користувачів під час знайомства з Lazy Cent. Якщо ви не знайшли відповіді на своє питання, будь ласка, зв'яжіться з нашою службою підтримки. Ми завжди раді допомогти вам розібратися з функціоналом та налаштуваннями.

