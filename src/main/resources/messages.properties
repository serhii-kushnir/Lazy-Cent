# ===== LANDING: FAQ =====
landing.faq.title=Часті запитання
landing.faq.subtitle=Не знайшли відповідь? Напишіть нам.
landing.faq.q1=Що можна обліковувати в Lazy Cent?
landing.faq.a1=Ви можете записувати особисті витрати й доходи, планувати місячний бюджет, переглядати історію за днями та аналізувати підсумки за періодами й категоріями.
landing.faq.q2=Чим відрізняються бюджет витрат і план доходів?
landing.faq.a2=Бюджет витрат дає змогу задати загальну суму й ліміти за категоріями. План доходів призначений для очікуваних надходжень і цілей за категоріями доходу.
landing.faq.q3=Як працюють спільні фінанси?
landing.faq.a3=Створіть сімейний простір або приєднайтеся за кодом-запрошенням. У ньому доступні спільні транзакції, бюджет, план доходів, підсумки й нотатки для учасників сім’ї.
landing.faq.q4=Чи можна експортувати дані?
landing.faq.a4=Так. На сторінках історії, підсумків і планування бюджету доступний експорт звітів у форматі Excel.
landing.faq.q5=Як захищено акаунт і як видалити дані?
landing.faq.a5=Паролі зберігаються як BCrypt-хеші. У налаштуваннях можна керувати даними або видалити акаунт; дані, якими ви поділилися в сімейному просторі, доступні його учасникам.

