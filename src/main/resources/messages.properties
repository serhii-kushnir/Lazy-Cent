landing.cta.intro=Приєднуйтесь до тисяч користувачів, які вже змінили своє ставлення до грошей. Lazy Cent допоможе вам не лише фіксувати витрати, а й планувати майбутнє. Створіть свій акаунт зараз і переконайтеся, наскільки простішим може бути фінансовий облік.
# --- STEPS ---
landing.steps.intro=Почати роботу з Lazy Cent дуже просто. Вам не потрібно витрачати багато часу на налаштування. Просто виконайте кілька простих кроків, щоб взяти свої фінанси під контроль вже сьогодні.
landing.steps.outro=Після цих кроків ви отримаєте повну картину своїх фінансів. Система автоматично почне рахувати баланс, а ви зможете переглядати детальну аналітику за кожен день або місяць.
