privacy.s1.l3.title=Пароль
privacy.s1.l3.text= — зберігається у зашифрованому вигляді.
privacy.s1.l4.title=Фінансові дані
privacy.s1.l4.text= — інформація про доходи, витрати, категорії, бюджети та нотатки, які ви вводите у застосунку.
privacy.s1.h2=Дані, зібрані автоматично
privacy.s1.p2=Коли ви користуєтеся нашими Сервісами, ми можемо автоматично збирати певну технічну інформацію, таку як:
privacy.s1.a1=IP-адреса
privacy.s1.a2=Тип браузера та версія
privacy.s1.a3=Операційна система
privacy.s1.a4=Дані про сесію (для безпеки)
privacy.s1.h3=Дані з соціальних мереж (OAuth2)
privacy.s1.p3=Якщо ви входите через Google або інші сервіси OAuth2, ми отримуємо ваше ім'я та електронну адресу (за вашим дозволом).

# ===== 2 =====
privacy.s2.title=2. Як ми використовуємо вашу інформацію?
privacy.s2.p1=Ми використовуємо зібрану інформацію для:
privacy.s2.l1.title=Надання та покращення Сервісів
privacy.s2.l1.text= — забезпечення роботи застосунку, відображення бюджету, аналітика та розробка нових функцій.
privacy.s2.l2.title=Спілкування з вами
privacy.s2.l2.text= — надсилання сповіщень (якщо ви підписалися), відповіді на ваші запити.
privacy.s2.l3.title=Безпеки та запобігання шахрайству
privacy.s2.l3.text= — захист вашого облікового запису та даних.
privacy.s2.l4.title=Дотримання законодавства
privacy.s2.l4.text= — виконання юридичних зобов'язань.
privacy.s2.hl.title=Важливо:
privacy.s2.hl.text= Ми НІКОЛИ не передаємо ваші фінансові дані третім особам без вашої явної згоди, крім випадків, передбачених законом.

# ===== 3 =====
privacy.s3.title=3. Чи передаємо ми вашу інформацію третім особам?
privacy.s3.p1=Ми не продаємо, не обмінюємо та не передаємо вашу особисту інформацію третім особам, за винятком наступних випадків:
privacy.s3.l1.title=Постачальники послуг
privacy.s3.l1.text= — ми можемо використовувати сторонні сервіси для хостингу, обробки даних або аналітики (наприклад, хмарні провайдери). Всі такі постачальники зобов'язані дотримуватися конфіденційності.
privacy.s3.l2.title=Юридичні вимоги
privacy.s3.l2.text= — якщо це вимагається законом або для захисту наших прав.

# ===== 4 =====
privacy.s4.title=4. Як ми захищаємо ваші дані?
privacy.s4.p1=Ми впроваджуємо сучасні заходи безпеки для захисту ваших даних:
privacy.s4.l1.title=Шифрування
privacy.s4.l1.text= — всі дані передаються через захищене з'єднання HTTPS, паролі зберігаються у зашифрованому вигляді.
privacy.s4.l2.title=Обмежений доступ
privacy.s4.l2.text= — доступ до даних мають лише уповноважені співробітники.
privacy.s4.l3.title=Регулярні перевірки
privacy.s4.l3.text= — ми проводимо аудит безпеки для виявлення та усунення вразливостей.
privacy.s4.p2=Однак жоден метод передачі даних через Інтернет або електронного зберігання не є на 100% безпечним. Ми робимо все можливе, але не можемо гарантувати абсолютну безпеку.

# ===== 5 =====
privacy.s5.title=5. Як довго ми зберігаємо ваші дані?
privacy.s5.p1=Ми зберігаємо ваші персональні дані лише доти, доки це необхідно для цілей, описаних у цій Політиці конфіденційності, або відповідно до вимог законодавства.
privacy.s5.l1.title=Облікові дані
privacy.s5.l1.text= — зберігаються до моменту видалення вашого акаунта.
privacy.s5.l2.title=Фінансові дані
privacy.s5.l2.text= — зберігаються до моменту видалення вами або до видалення акаунта.
privacy.s5.l3.title=Технічні дані
privacy.s5.l3.text= — можуть зберігатися до 12 місяців для аналітики та безпеки.
privacy.s5.p2=Ви можете в будь-який момент видалити свої дані через налаштування акаунта.

# ===== 6 =====
privacy.s6.title=6. Файли cookie та подібні технології
privacy.s6.p1=Ми використовуємо файли cookie для:
privacy.s6.l1.title=Підтримки сесій
privacy.s6.l1.text= — щоб ви залишалися авторизованими.
privacy.s6.l2.title=Налаштувань
privacy.s6.l2.text= — збереження ваших уподобань (наприклад, теми).
privacy.s6.l3.title=Аналітики
privacy.s6.l3.text= — для покращення роботи Сервісів.
privacy.s6.p2=Ви можете керувати файлами cookie у налаштуваннях вашого браузера. Вимкнення cookie може вплинути на роботу деяких функцій застосунку.

# ===== 7 =====
privacy.s7.title=7. Ваші права
privacy.s7.p1=Залежно від вашого місцезнаходження, ви можете мати такі права щодо ваших персональних даних:
privacy.s7.l1.title=Доступ
privacy.s7.l1.text= — ви можете переглянути свої дані в будь-який час.
privacy.s7.l2.title=Виправлення
privacy.s7.l2.text= — ви можете змінити або оновити свої дані.
privacy.s7.l3.title=Видалення
privacy.s7.l3.text= — ви можете назавжди видалити свій акаунт та всі пов'язані дані.
privacy.s7.p2=Для реалізації своїх прав зв'яжіться з нами за адресою:

