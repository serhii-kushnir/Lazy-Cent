# ===== LANDING: FAQ =====
landing.faq.title=Часті запитання
landing.faq.subtitle=Не знайшли відповідь? Напишіть нам.
landing.faq.q1=LazyCent справді безкоштовний?
landing.faq.a1=Так. LazyCent повністю безкоштовний — без обмежень за кількістю транзакцій, категорій чи нотаток. Жодної реклами, жодних прихованих платежів.
landing.faq.q2=Як працює ведення бюджету за днями?
landing.faq.a2=Кожен день — окремий запис із транзакціями. Система автоматично рахує баланс, переносить залишок на наступний день і показує аналітику за весь місяць.
landing.faq.q3=Чи захищені мої фінансові дані?
landing.faq.a3=Так. Паролі зберігаються у зашифрованому вигляді (BCrypt), доступ до даних має лише власник акаунта. Ми не передаємо ваші дані третім особам і не використовуємо їх для реклами.
landing.faq.q4=Чи можна користуватися з кількох пристроїв?
landing.faq.a4=Так, застосунок працює у браузері — заходьте з будь-якого пристрою. Усі зміни синхронізуються автоматично.
landing.faq.q5=Як видалити акаунт?
landing.faq.a5=У налаштуваннях акаунта є розділ «Небезпечна зона». Там можна видалити всі дані або повністю видалити акаунт. Дію можна скасувати лише до моменту підтвердження.

