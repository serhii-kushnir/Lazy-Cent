<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{family.shared.totalsPage.heading} + ' - ' + #{app.title}">Спільні підсумки</title>
    <div th:replace="~{fragments/head :: themeAssets(robots='noindex, nofollow')}"></div>
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeInUp .45s ease both; }
        .animate-fade-down { animation: fadeInDown .4s ease both; }
        .delay-1 { animation-delay: .05s; }
        .delay-2 { animation-delay: .1s; }
        .delay-3 { animation-delay: .15s; }
        .delay-4 { animation-delay: .2s; }
        .delay-5 { animation-delay: .25s; }
        .category-row, .category-card-wrapper { animation: fadeInUp .4s ease both; }
        .category-row:nth-child(2), .category-card-wrapper:nth-child(2) { animation-delay: .04s; }
        .category-row:nth-child(3), .category-card-wrapper:nth-child(3) { animation-delay: .08s; }
        .category-row:nth-child(4), .category-card-wrapper:nth-child(4) { animation-delay: .12s; }
        .category-row:nth-child(5), .category-card-wrapper:nth-child(5) { animation-delay: .16s; }
        .category-row:nth-child(n+6), .category-card-wrapper:nth-child(n+6) { animation-delay: .2s; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
        .page-max { max-width: 1920px; margin: 0 auto; }
        .min-w-0 { min-width: 0; }
        .stat-card { height: 100%; border: 0; border-radius: 1rem; background: var(--bs-card-bg); box-shadow: 0 4px 12px rgba(0,0,0,.05); }
        [data-bs-theme="dark"] .stat-card { background: #1d2027; border: 1px solid #2a2e37; }
        .icon-circle { width: 56px; height: 56px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; border-radius: 50%; font-size: 1.5rem; }
        .bg-card-bg { background-color: var(--bs-card-bg); }
        [data-bs-theme="dark"] .bg-card-bg { background-color: #1d2027; }
        .summary-panel { overflow: hidden; border-radius: 1rem; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
        .view-toggle { display: flex; gap: .3rem; background: var(--bs-secondary-bg); border-radius: .5rem; padding: .2rem; flex-shrink: 0; }
        .view-toggle .btn { border: none; padding: .5rem 1.2rem; font-size: 1rem; border-radius: .375rem !important; background: transparent; color: var(--bs-secondary-color); font-weight: 600; transition: all .2s ease; }
        .view-toggle .btn.active { background: var(--bs-body-bg); color: var(--bs-primary); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
        [data-bs-theme="dark"] .view-toggle .btn.active { background: #1d2027; color: #6ea8fe; }
        .summary-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .5rem 0; margin-bottom: .5rem; }
        .summary-toolbar .search-wrap { flex: 1 1 200px; min-width: 150px; }
        .summary-toolbar .search-wrap .input-group-text { background: transparent; border-right: 0; }
        .summary-toolbar .search-wrap .form-control { border-left: 0; border-right: 0; }
        .summary-toolbar .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
        .summary-toolbar .filter-group input, .summary-toolbar .filter-group select { width: auto; min-width: 130px; }
        .summary-toolbar .info-text { margin-left: auto; color: var(--bs-secondary-color); font-size: .85rem; white-space: nowrap; }
        .summary-table { width: 100%; font-size: .9rem; }
        .summary-table th { background: var(--bs-tertiary-bg); color: var(--bs-secondary-color); font-size: .8rem; text-transform: uppercase; }
        .summary-table th, .summary-table td { padding: .65rem .75rem; border-bottom: 1px solid var(--bs-border-color); }
        .summary-table tbody tr > td { background-color: #212529 !important; color: #f8f9fa; }
        .category-card { height: 100%; }
        .cards-view { background-color: #212529; }
        .category-card.stat-card { background-color: #1d2027; color: #f8f9fa; }
        .category-card .card-body { padding: 1.25rem; }
        .table-view.hidden, .cards-view { display: none; }
        .cards-view.show { display: block; }
        .empty-note { padding: 2rem 1rem; text-align: center; color: var(--bs-secondary-color); background-color: rgb(33 37 41); }
        .empty-note i { display: block; margin-bottom: .75rem; font-size: 3rem; opacity: .25; }
        @media (max-width: 767.98px) {
            .export-actions, .export-button { width: 100%; }
            .export-actions { flex-direction: column; }
            .export-button { justify-content: center; }
            .income-link { width: 100%; justify-content: center; }
        }
        @media (max-width: 767.98px) {
            .summary-toolbar { align-items: stretch; flex-direction: column; padding: .5rem 0; }
            .summary-toolbar .search-wrap, .summary-toolbar .filter-group,
            .summary-toolbar .filter-group input, .summary-toolbar .filter-group select,
            .summary-toolbar .info-text { width: 100%; min-width: 0; }
            .summary-toolbar .search-wrap {
                display: flex;
                flex-wrap: nowrap;
                align-items: stretch;
                height: 34px !important;
                min-height: 34px !important;
                max-height: 34px !important;
                margin: 0;
            }
            .summary-toolbar .search-wrap > .input-group-text,
            .summary-toolbar .search-wrap > .form-control,
            .summary-toolbar .search-wrap > .btn {
                box-sizing: border-box;
                height: 34px !important;
                min-height: 34px !important;
                max-height: 34px !important;
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                display: flex;
                align-items: center;
            }
            .summary-toolbar .search-wrap > .form-control {
                display: block;
                min-width: 0;
                line-height: 32px;
            }
            .summary-toolbar .search-wrap > .btn { line-height: 32px; }
            .summary-toolbar .search-wrap > .input-group-text { line-height: 32px; }
            .summary-toolbar .filter-group { display: grid; grid-template-columns: 1fr 1fr; }
            .summary-toolbar .info-text { text-align: center; margin-left: 0; }
            .summary-table { min-width: 560px; }
        }
        @media print {
            nav.navbar, footer, .no-print, .summary-toolbar, .view-toggle { display: none !important; }
            .container-fluid { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .summary-panel, .stat-card { box-shadow: none !important; border: 1px solid #aaa !important; }
            .summary-table { min-width: 0 !important; }
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('family')}"></nav>
<div th:replace="~{fragments/settings-panel :: settingsPanel}"></div>
<div th:replace="~{fragments/cookie-banner :: cookieBanner}"></div>
<div th:replace="~{fragments/toast :: toastContainer}"></div>

<div class="container-fluid px-3 px-md-4 mt-4 page-max">
    <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center gap-3 mb-4 animate-fade-down">
        <h2 class="mb-0 fw-bold text-center text-md-start">
            <i class="fas fa-chart-pie me-2 text-primary"></i>
            <span th:text="#{family.shared.totalsPage.heading}">Спільні підсумки</span>
            <small class="text-muted fw-normal d-block d-md-inline ms-md-2 text-nowrap">
                <i class="far fa-calendar-alt me-1"></i>
                <span th:text="${#temporals.format(startDate, 'dd.MM.yyyy')}">01.11.2026</span>
                <span class="mx-1">—</span>
                <span th:text="${#temporals.format(endDate, 'dd.MM.yyyy')}">25.11.2026</span>
            </small>
        </h2>
        <div class="d-flex gap-2 justify-content-center no-print export-actions">
            <a th:href="@{/family/shared/totals/export(startDate=${startDate},endDate=${endDate})}" class="btn btn-success export-button">
                <i class="fas fa-file-excel me-1"></i><span th:text="#{totals.export}">Експорт</span>
            </a>
            <a href="/family/shared/income" class="btn btn-outline-success income-link">
                <i class="fas fa-hand-holding-dollar me-1"></i><span th:text="#{family.shared.income.open}">Спільні доходи</span>
            </a>
            <button type="button" class="btn btn-warning d-none d-md-inline-flex" onclick="window.print()">
                <i class="fas fa-print me-1"></i><span th:text="#{btn.print}">Друк</span>
            </button>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4 animate-fade-up delay-1">
            <div class="stat-card"><div class="card-body p-4 d-flex align-items-center gap-3">
                <div class="icon-circle bg-danger-subtle text-danger"><i class="fas fa-arrow-down"></i></div>
                <div class="min-w-0"><h6 class="text-muted mb-1" th:text="#{totals.expense}">Витрати</h6>
                    <h3 class="text-danger mb-0 text-break" th:text="${#numbers.formatDecimal(totalExpenses, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}">0</h3></div>
            </div></div>
        </div>
        <div class="col-12 col-md-4 animate-fade-up delay-2">
            <div class="stat-card"><div class="card-body p-4 d-flex align-items-center gap-3">
                <div class="icon-circle bg-success-subtle text-success"><i class="fas fa-arrow-up"></i></div>
                <div class="min-w-0"><h6 class="text-muted mb-1" th:text="#{totals.income}">Доходи</h6>
                    <h3 class="text-success mb-0 text-break" th:text="${#numbers.formatDecimal(totalIncomes, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}">0</h3></div>
            </div></div>
        </div>
        <div class="col-12 col-md-4 animate-fade-up delay-3">
            <div class="stat-card"><div class="card-body p-4 d-flex align-items-center gap-3">
                <div class="icon-circle bg-primary-subtle text-primary"><i class="fas fa-balance-scale"></i></div>
                <div class="min-w-0"><h6 class="text-muted mb-1" th:text="#{totals.netBalance}">Баланс</h6>
                    <h3 class="mb-0 text-break" th:classappend="${balance >= 0} ? 'text-success' : 'text-danger'"
                        th:text="${#numbers.formatDecimal(balance, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}">0</h3></div>
            </div></div>
        </div>
    </div>

    <section class="summary-panel bg-card-bg mb-4 animate-fade-up delay-4">
        <div class="d-flex align-items-center gap-3 flex-wrap animate-fade-up delay-5" style="padding: 1rem; border-bottom: 1px solid var(--bs-border-color);">
            <div class="icon-circle bg-info-subtle text-info"><i class="fas fa-tags"></i></div>
            <div class="flex-grow-1"><h6 class="text-muted mb-0" th:text="#{totals.categories}">Категорії</h6>
                <h3 class="mb-0" id="categoryCount" th:text="${categories.size()}">0</h3></div>
            <div class="view-toggle no-print" id="viewToggle">
                <button type="button" class="btn active" data-view="table" th:title="#{day.table}">
                    <i class="fas fa-table"></i><span class="d-none d-sm-inline" th:text="#{day.table}">Таблиця</span>
                </button>
                <button type="button" class="btn" data-view="cards" th:title="#{day.cards}">
                    <i class="fas fa-th-large"></i><span class="d-none d-sm-inline" th:text="#{day.cards}">Картки</span>
                </button>
            </div>
        </div>
        <div class="summary-toolbar no-print px-3 pt-3 animate-fade-up delay-5" style="margin: 0; border-bottom: none;">
            <div class="input-group search-wrap">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input id="searchInput" type="search" class="form-control" th:placeholder="#{totals.searchCategories}">
                <button id="searchClear" type="button" class="btn btn-outline-secondary" th:title="#{btn.clear}">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="filter-group">
                <input id="dateFrom" type="date" class="form-control form-control-sm" th:value="${startDate}" th:aria-label="#{common.from}">
                <input id="dateTo" type="date" class="form-control form-control-sm" th:value="${endDate}" th:aria-label="#{common.to}">
                <select id="typeFilter" class="form-select form-select-sm">
                    <option value="all" th:text="#{totals.allTypes}">Всі типи</option>
                    <option value="EXPENSE" th:text="#{type.expenseFilter}">Витрати</option>
                    <option value="INCOME" th:text="#{type.incomeFilter}">Доходи</option>
                </select>
                <select id="categoryFilter" class="form-select form-select-sm">
                    <option value="all" th:text="#{totals.allCategories}">Всі категорії</option>
                    <option th:each="categoryName : ${#sets.toSet(categories.![categoryName])}"
                            th:value="${categoryName}" th:text="${categoryName}"></option>
                </select>
                <button id="resetFilters" type="button" class="btn btn-outline-warning btn-sm"
                        th:title="#{family.shared.resetFilters}"
                        th:classappend="${startDate != defaultStartDate or endDate != defaultEndDate} ? '' : 'd-none'"
                        th:attr="data-default-start=${defaultStartDate},data-default-end=${defaultEndDate}">
                    <i class="fas fa-filter-circle-xmark me-1"></i><span th:text="#{family.shared.resetFilters}">Скинути</span>
                </button>
            </div>
            <span class="info-text" id="visibleInfo"></span>
        </div>

        <div id="tableView" class="table-view">
            <div class="table-responsive">
                <table class="summary-table table-hover mb-0">
                    <thead><tr>
                        <th class="ps-4 sortable" data-sort="category" th:text="#{totals.col.category}">Категорія</th>
                        <th class="text-center sortable" data-sort="type" th:text="#{totals.col.type}">Тип</th>
                        <th class="text-end pe-4 sortable" data-sort="amount" th:text="#{totals.col.amount}">Сума</th>
                    </tr></thead>
                    <tbody id="categoryRows">
                    <tr th:each="category : ${categories}" class="category-row"
                        th:data-category="${category.categoryName}" th:data-type="${category.type}" th:data-amount="${category.amount}">
                        <td class="ps-4 fw-semibold"><i class="fas fa-folder text-muted me-2"></i><span th:text="${category.categoryName}">Категорія</span></td>
                        <td class="text-center">
                            <span th:if="${category.type == 'EXPENSE'}" class="badge bg-danger" th:text="#{type.EXPENSE}">Витрата</span>
                            <span th:if="${category.type == 'INCOME'}" class="badge bg-success" th:text="#{type.INCOME}">Дохід</span>
                        </td>
                        <td class="text-end pe-4 fw-semibold" th:classappend="${category.type == 'EXPENSE'} ? 'text-danger' : 'text-success'"
                            th:text="${#numbers.formatDecimal(category.amount, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="cardsView" class="cards-view p-3">
            <div class="row g-3" id="categoryCards">
                <div th:each="category : ${categories}" class="col-12 col-sm-6 col-lg-4 category-card-wrapper"
                     th:data-category="${category.categoryName}" th:data-type="${category.type}" th:data-amount="${category.amount}">
                    <div class="stat-card category-card"><div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-circle" th:classappend="${category.type == 'EXPENSE'} ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success'"><i class="fas fa-folder"></i></div>
                            <div class="min-w-0"><h6 class="mb-1 text-truncate" th:text="${category.categoryName}">Категорія</h6>
                                <span th:if="${category.type == 'EXPENSE'}" class="badge bg-danger" th:text="#{type.EXPENSE}">Витрата</span>
                                <span th:if="${category.type == 'INCOME'}" class="badge bg-success" th:text="#{type.INCOME}">Дохід</span>
                                <h4 class="mb-0 mt-2 text-break" th:classappend="${category.type == 'EXPENSE'} ? 'text-danger' : 'text-success'"
                                    th:text="${#numbers.formatDecimal(category.amount, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}">0</h4>
                            </div>
                        </div>
                    </div></div>
                </div>
            </div>
        </div>
        <div id="noResults" class="empty-note" style="display:none">
            <i class="fas fa-inbox"></i><h5 th:text="#{common.noData}">Немає даних</h5>
        </div>
    </section>
</div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/toast :: toastScript}"></div>
<div th:replace="~{fragments/settings-panel :: settingsPanelScript}"></div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var search = document.getElementById('searchInput');
        var type = document.getElementById('typeFilter');
        var category = document.getElementById('categoryFilter');
        var dateFrom = document.getElementById('dateFrom');
        var dateTo = document.getElementById('dateTo');
        var resetFilters = document.getElementById('resetFilters');
        var table = document.getElementById('tableView');
        var cards = document.getElementById('cardsView');
        var rows = Array.from(document.querySelectorAll('.category-row'));
        var cardItems = Array.from(document.querySelectorAll('.category-card-wrapper'));
        var info = document.getElementById('visibleInfo');
        var noResults = document.getElementById('noResults');
        function updateResetButton() {
            var active = search.value.trim() !== ''
                || type.value !== 'all'
                || category.value !== 'all'
                || dateFrom.value !== resetFilters.dataset.defaultStart
                || dateTo.value !== resetFilters.dataset.defaultEnd;
            resetFilters.classList.toggle('d-none', !active);
        }
        function reloadDates() {
            if (!dateFrom.value || !dateTo.value || dateFrom.value > dateTo.value) return;
            window.location.href = '/family/shared/totals?startDate='
                + encodeURIComponent(dateFrom.value) + '&endDate=' + encodeURIComponent(dateTo.value);
        }
        function applyFilters() {
            var query = search.value.trim().toLocaleLowerCase();
            var selectedCategory = category.value;
            var visible = 0;
            rows.forEach(function (row, index) {
                var match = (!query || row.dataset.category.toLocaleLowerCase().includes(query))
                    && (type.value === 'all' || row.dataset.type === type.value)
                    && (selectedCategory === 'all' || row.dataset.category === selectedCategory);
                row.hidden = !match;
                cardItems[index].hidden = !match;
                if (match) visible++;
            });
            info.textContent = visible + ' / ' + rows.length;
            noResults.style.display = visible === 0 ? 'block' : 'none';
        }
        document.querySelectorAll('[data-view]').forEach(function (button) {
            button.addEventListener('click', function () {
                var cardsMode = button.dataset.view === 'cards';
                table.classList.toggle('hidden', cardsMode);
                cards.classList.toggle('show', cardsMode);
                document.querySelectorAll('[data-view]').forEach(function (item) {
                    item.classList.toggle('active', item === button);
                });
            });
        });
        search.addEventListener('input', applyFilters);
        search.addEventListener('input', updateResetButton);
        type.addEventListener('change', applyFilters);
        type.addEventListener('change', updateResetButton);
        category.addEventListener('change', applyFilters);
        category.addEventListener('change', updateResetButton);
        document.getElementById('searchClear').addEventListener('click', function () {
            search.value = '';
            applyFilters();
            updateResetButton();
            search.focus();
        });
        dateFrom.addEventListener('change', reloadDates);
        dateTo.addEventListener('change', reloadDates);
        dateFrom.addEventListener('input', updateResetButton);
        dateTo.addEventListener('input', updateResetButton);
        resetFilters.addEventListener('click', function () {
            var params = new URLSearchParams({
                startDate: resetFilters.dataset.defaultStart,
                endDate: resetFilters.dataset.defaultEnd
            });
            window.location.href = '/family/shared/totals?' + params.toString();
        });
        document.querySelectorAll('.sortable').forEach(function (heading) {
            heading.addEventListener('click', function () {
                var property = heading.dataset.sort;
                var direction = heading.dataset.direction === 'asc' ? 'desc' : 'asc';
                heading.dataset.direction = direction;
                var sorted = rows.slice().sort(function (a, b) {
                    var left = a.dataset[property], right = b.dataset[property];
                    var result = property === 'amount' ? Number(left) - Number(right) : left.localeCompare(right);
                    return direction === 'asc' ? result : -result;
                });
                sorted.forEach(function (row) {
                    document.getElementById('categoryRows').appendChild(row);
                    var card = cardItems.find(function (item) {
                        return item.dataset.category === row.dataset.category && item.dataset.type === row.dataset.type;
                    });
                    if (card) document.getElementById('categoryCards').appendChild(card);
                });
                rows = sorted;
                cardItems = Array.from(document.querySelectorAll('.category-card-wrapper'));
                applyFilters();
            });
        });
        var savedView = 'table';
        try { savedView = localStorage.getItem('family-shared-totals-view') || 'table'; } catch (error) {}
        if (savedView === 'cards') document.querySelector('[data-view="cards"]').click();
        document.querySelectorAll('[data-view]').forEach(function (button) {
            button.addEventListener('click', function () {
                try { localStorage.setItem('family-shared-totals-view', button.dataset.view); } catch (error) {}
            });
        });
        updateResetButton();
        applyFilters();
    });
</script>
</body>
</html>
