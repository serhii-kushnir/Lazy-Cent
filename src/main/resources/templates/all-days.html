<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Всі дні - WebMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <div th:replace="~{fragments :: themeAssets}"></div>
</head>
<body>
<nav th:replace="~{fragments :: navbar('all-days')}"></nav>

<div class="container mt-4">
    <h2><i class="fas fa-calendar-alt me-2"></i>Всі дні</h2>

    <div th:if="${allBudgets.empty}" class="alert alert-warning">
        Немає даних. Натисніть "Завантажити демо-дані" на головній сторінці.
    </div>

    <div class="row mt-4">
        <div th:each="budget : ${allBudgets}" class="col-md-4 mb-3">
            <div class="card">
                <div class="card-header"
                     th:classappend="${budget.remainingBalance >= 0} ? 'bg-success text-white' : 'bg-danger text-white'">
                    <h5 class="mb-0">
                        <i class="fas fa-calendar-day me-2"></i>
                        <span th:text="${budget.dayName}"></span>,
                        <span th:text="${budget.date}"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <p><i class="fas fa-arrow-down text-danger me-2"></i>Витрати:
                        <strong class="text-danger" th:text="${#numbers.formatDecimal(budget.totalExpenses, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></strong>
                    </p>
                    <p><i class="fas fa-arrow-up text-success me-2"></i>Доходи:
                        <strong class="text-success" th:text="${#numbers.formatDecimal(budget.totalIncomes, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></strong>
                    </p>
                    <p><i class="fas fa-balance-scale me-2"></i>Баланс:
                        <strong th:class="${budget.remainingBalance >= 0} ? 'text-success' : 'text-danger'"
                                th:text="${#numbers.formatDecimal(budget.remainingBalance, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></strong>
                    </p>
                    <a th:href="'/day/' + ${budget.date}" class="btn btn-primary w-100">
                        <i class="fas fa-edit me-1"></i>Редагувати
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
</body>
</html>
