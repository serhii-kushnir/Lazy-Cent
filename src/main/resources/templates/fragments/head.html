<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==================== БЕЗ Chart.js ==================== -->
<th:block th:fragment="themeAssets">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="robots" th:content="${robots}">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/img/icons/icon-192x192.png">
    <meta name="theme-color" content="#0d6efd">

    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">

    <th:block th:insert="~{fragments/head :: themeInit}"></th:block>
</th:block>

<!-- ==================== З Chart.js ==================== -->
<th:block th:fragment="themeAssetsWithCharts">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="robots" th:content="${robots}">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/img/icons/icon-192x192.png">
    <meta name="theme-color" content="#0d6efd">

    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">

    <script src="/lib/chart.js/chart.umd.min.js"></script>

    <th:block th:insert="~{fragments/head :: themeInit}"></th:block>
</th:block>

<th:block th:fragment="themeInit">
    <script>
        (function () {
            let saved = null;
            try { saved = localStorage.getItem('lazycent-theme'); } catch (e) {}

            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-bs-theme', saved);
            } else {
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-bs-theme', systemDark ? 'dark' : 'light');
            }
        })();
    </script>
</th:block>

</body>
</html>
