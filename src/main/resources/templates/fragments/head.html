<!--
  Спільні head-ресурси: meta, links, стилі, ініціалізація теми.
  Підключається так:  <div th:replace="~{fragments/head :: themeAssets}"></div>

  P1.d: стилі перенесено у /css/app.css (кешується браузером).
  Скрипт ініціалізації теми залишається інлайном — він має виконатись
  ДО першого рендеру, інакше буде FOUC (flash of unstyled content).
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="themeAssets">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/lib/chart.js/chart.umd.min.js"></script>

    <!--
      Ініціалізація теми виконується ДО першого рендеру.
      Читає збережену тему з localStorage; за замовчуванням — dark.
      Це не можна винести в зовнішній файл: браузер завантажить його
      асинхронно і користувач побачить світлу тему пів секунди.
    -->
    <script>
        (function () {
            const saved = localStorage.getItem('lazycent-theme');
            if (saved) {
                document.documentElement.setAttribute('data-bs-theme', saved);
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('lazycent-theme', 'dark');
            }
        })();
    </script>
</th:block>

<!-- Заглушка для зворотної сумісності — старі шаблони викликають themeScript,
     але він більше не потрібен (тема встановлюється у themeAssets вище). -->
<th:block th:fragment="themeScript"></th:block>

</body>
</html>
