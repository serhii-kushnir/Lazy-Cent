<!--
  Спільні head-ресурси.
  Підключається так:
    <div th:replace="~{fragments/head :: themeAssets}"></div>            ← без Chart.js
    <div th:replace="~{fragments/head :: themeAssetsWithCharts}"></div>  ← з Chart.js

  P2.b: Chart.js (~200 КБ) винесено в окремий фрагмент. Сторінки без
  графіків (login, register, notes, privacy, terms, budget, ...) його
  більше не вантажать.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==================== БЕЗ Chart.js ==================== -->
<th:block th:fragment="themeAssets">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <th:block th:insert="~{fragments/head :: themeInit}"/>
</th:block>

<!-- ==================== З Chart.js ==================== -->
<th:block th:fragment="themeAssetsWithCharts">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <th:block th:insert="~{fragments/head :: themeInit}"/>
</th:block>

<!--
  Ініціалізація теми виконується ДО першого рендеру.
  Інлайн обов'язковий — інакше буде FOUC (світла тема блимне).
-->
<th:block th:fragment="themeInit">
    <script>
        (function () {
            const saved = localStorage.getItem('lazycent-theme');
            if (saved) {
                document.documentElement.setAttribute('data-bs-theme', saved);
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('lazycent-theme', 'dark');
            }
        })();
    </script>
</th:block>
</body>
</html>
