<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Фрагмент "rows" — набір <tr> для таблиці днів.
  Використовується:
    - у all-days.html (початковий рендер)
    - у /all-days/more (AJAX)

  ⚠️ НЕ використовуємо окремий фрагмент row(budget) з th:replace="::row(${budget})",
  бо це призводило до "budget is null" через особливості th:each + th:replace
  на одному елементі в самопосиланні.
-->
<th:block th:fragment="rows">
    <tr th:each="budget : ${allBudgets}" class="day-row"
        th:data-date="${budget.date}"
        th:data-dayname="${budget.dayName}"
        th:data-expenses="${budget.totalExpenses}"
        th:data-incomes="${budget.totalIncomes}"
        th:data-balance="${budget.remainingBalance}"
        th:data-starting="${budget.startingBalance}"
        th:data-expense-count="${budget.expenses.size()}"
        th:data-income-count="${budget.incomes.size()}"
        th:data-id="${budget.id}">
        <td class="col-number"></td>
        <td class="col-date" th:text="${budget.date}"></td>
        <td class="col-day"
            th:text="${dayNames[budget.dayName]} ?: ${budget.dayName}"></td>
        <td class="col-amount text-expense"
            th:text="${#numbers.formatDecimal(budget.totalExpenses, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></td>
        <td class="col-amount text-income"
            th:text="${#numbers.formatDecimal(budget.totalIncomes, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></td>
        <td class="col-balance"
            th:classappend="${budget.remainingBalance >= 0} ? 'text-balance-positive' : 'text-balance-negative'"
            th:text="${#numbers.formatDecimal(budget.remainingBalance, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></td>
        <td class="col-count"
            th:text="${budget.expenses.size() + budget.incomes.size()}"></td>
        <td class="col-actions no-print">
            <a th:href="'/day/' + ${budget.date}"
               class="btn btn-sm btn-outline-primary"
               th:title="#{allDays.viewDay}">
                <i class="fas fa-eye me-1"></i>
                <span th:text="#{btn.view}">Переглянути</span>
            </a>
            <button type="button" class="btn btn-sm btn-outline-danger action-delete-day ms-1"
                    th:data-id="${budget.id}"
                    th:data-date="${budget.date}"
                    th:data-dayname="${budget.dayName}"
                    th:data-expenses="${budget.totalExpenses}"
                    th:data-incomes="${budget.totalIncomes}"
                    th:data-balance="${budget.remainingBalance}"
                    th:data-starting="${budget.startingBalance}"
                    th:data-expense-count="${budget.expenses.size()}"
                    th:data-income-count="${budget.incomes.size()}"
                    th:title="#{allDays.deleteDay}">
                <i class="fas fa-trash me-1"></i>
                <span th:text="#{btn.delete}">Видалити</span>
            </button>
        </td>
    </tr>
</th:block>

</body>
</html>
