<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============================================================
     ACTIVE NOTE CARD
     ============================================================ -->
<th:block th:fragment="activeCard(note)">
    <div class="col-12 col-sm-6 col-md-4 col-xl-3 note-card-wrapper"
         data-kind="active"
         th:attr="data-shared=${note.shareWithFamily}">
        <div class="note-card animate-fade-up"
             th:classappend="${note.pinned} ? 'pinned' : ''"
             th:data-id="${note.id}"
             th:data-archived="false"
             th:data-pinned="${note.pinned}"
             th:data-share-with-family="${note.shareWithFamily != null and note.shareWithFamily}"
             th:data-color="${note.color}"
             th:data-textcolor="${note.textColor}"
             th:style="'background-color:' + ${note.color}">

            <div class="card-body"
                 role="button" tabindex="0"
                 th:aria-label="${note.title}"
                 th:onclick="'editNote(' + ${note.id} + ')'">

                <div class="d-flex align-items-start gap-2 mb-1">
                    <input type="checkbox" class="note-checkbox form-check-input"
                           th:data-id="${note.id}"
                           th:aria-label="#{notes.select.aria(${note.title})}"
                           onclick="event.stopPropagation()"/>

                    <h5 class="card-title mb-0 flex-grow-1"
                        th:text="${note.title}"
                        th:title="${note.title}"
                        th:style="'color:' + ${note.textColor}">Заголовок</h5>

                    <span th:if="${note.shareWithFamily}"
                          class="shared-badge"
                          th:title="#{badge.shared.tooltip}">
                        <i class="fas fa-users me-1"></i><span th:text="#{badge.shared}">Спільна</span>
                    </span>
                </div>

                <p class="card-text"
                   th:text="${note.content}"
                   th:title="${note.content != null and note.content.length() > 150 ? note.content : ''}"
                   th:style="'color:' + ${note.textColor}">Текст нотатки...</p>

                <div class="mt-2 d-flex justify-content-end gap-1 align-items-center"
                     th:style="'font-size: 0.7rem; opacity: 0.6; color: ' + ${note.textColor}">
                    <i class="far fa-clock me-1"></i>
                    <span class="rel-time"
                          th:data-ts="${note.updatedAt != null ? #temporals.formatISO(note.updatedAt) : #temporals.formatISO(note.createdAt)}"
                          th:title="${note.updatedAt != null ? #temporals.format(note.updatedAt, 'dd.MM.yyyy HH:mm') : #temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}"
                          th:text="${note.updatedAt != null ? #temporals.format(note.updatedAt, 'dd.MM.yyyy HH:mm') : #temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}">12.11.2026</span>
                </div>
            </div>

            <div class="card-footer">
                <div class="d-flex gap-1 align-items-center">
                    <button type="button" class="btn-icon"
                            th:title="${note.pinned} ? #{notes.action.unpin} : #{notes.action.pin}"
                            th:aria-label="${note.pinned} ? #{notes.action.unpin} : #{notes.action.pin}"
                            th:onclick="'togglePin(' + ${note.id} + ', event)'">
                        <i class="fas fa-thumbtack"
                           th:classappend="${note.pinned} ? 'pin-icon' : ''"></i>
                    </button>
                    <button type="button" class="btn-icon"
                            th:title="#{notes.action.archive}"
                            th:aria-label="#{notes.action.archive}"
                            th:onclick="'toggleArchive(' + ${note.id} + ', event)'">
                        <i class="fas fa-archive"></i>
                    </button>
                    <button type="button" class="btn-icon"
                            th:title="#{notes.action.duplicate}"
                            th:aria-label="#{notes.action.duplicate}"
                            th:onclick="'duplicateNote(' + ${note.id} + ', event)'">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                <button type="button" class="btn-icon text-danger"
                        th:title="#{notes.action.delete}"
                        th:aria-label="#{notes.action.delete}"
                        th:onclick="'deleteNote(' + ${note.id} + ', event)'">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
</th:block>

<!-- ============================================================
     ARCHIVED NOTE CARD
     ============================================================ -->
<th:block th:fragment="archivedCard(note)">
    <div class="col-12 col-sm-6 col-md-4 col-xl-3 note-card-wrapper"
         data-kind="archived"
         th:attr="data-shared=${note.shareWithFamily}">
        <div class="note-card archived animate-fade-up"
             th:data-id="${note.id}"
             th:data-archived="true"
             th:data-pinned="${note.pinned}"
             th:data-share-with-family="${note.shareWithFamily != null and note.shareWithFamily}"
             th:data-color="${note.color}"
             th:data-textcolor="${note.textColor}"
             th:style="'background-color:' + ${note.color}">

            <div class="card-body"
                 role="button" tabindex="0"
                 th:aria-label="${note.title}"
                 th:onclick="'editNote(' + ${note.id} + ')'">

                <div class="d-flex align-items-start gap-2 mb-1">
                    <input type="checkbox" class="note-checkbox form-check-input"
                           th:data-id="${note.id}"
                           th:aria-label="#{notes.select.aria(${note.title})}"
                           onclick="event.stopPropagation()"/>

                    <h5 class="card-title mb-0 flex-grow-1"
                        th:text="${note.title}"
                        th:title="${note.title}"
                        th:style="'color:' + ${note.textColor}">Заголовок</h5>

                    <span th:if="${note.shareWithFamily}" class="shared-badge"
                          th:title="#{badge.shared.tooltip}">
                        <i class="fas fa-users me-1"></i><span th:text="#{badge.shared}">Спільна</span>
                    </span>
                </div>

                <p class="card-text"
                   th:text="${note.content}"
                   th:title="${note.content != null and note.content.length() > 150 ? note.content : ''}"
                   th:style="'color:' + ${note.textColor}">Текст...</p>

                <div class="mt-2 d-flex justify-content-end gap-1 align-items-center"
                     th:style="'font-size: 0.7rem; opacity: 0.6; color: ' + ${note.textColor}">
                    <i class="far fa-clock me-1"></i>
                    <span class="rel-time"
                          th:data-ts="${note.updatedAt != null ? #temporals.formatISO(note.updatedAt) : #temporals.formatISO(note.createdAt)}"
                          th:title="${note.updatedAt != null ? #temporals.format(note.updatedAt, 'dd.MM.yyyy HH:mm') : #temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}"
                          th:text="${note.updatedAt != null ? #temporals.format(note.updatedAt, 'dd.MM.yyyy HH:mm') : #temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}">12.11.2026</span>
                </div>
            </div>

            <div class="card-footer">
                <div class="d-flex gap-1 align-items-center">
                    <button type="button" class="btn-icon"
                            th:title="#{notes.action.unarchive}"
                            th:aria-label="#{notes.action.unarchive}"
                            th:onclick="'toggleArchive(' + ${note.id} + ', event)'">
                        <i class="fas fa-undo"></i>
                    </button>
                    <button type="button" class="btn-icon"
                            th:title="#{notes.action.duplicate}"
                            th:aria-label="#{notes.action.duplicate}"
                            th:onclick="'duplicateNote(' + ${note.id} + ', event)'">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                <button type="button" class="btn-icon text-danger"
                        th:title="#{notes.action.delete}"
                        th:aria-label="#{notes.action.delete}"
                        th:onclick="'deleteNote(' + ${note.id} + ', event)'">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
