<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg wm-navbar">
    <div class="container-fluid">
        <!-- Логотип для АВТОРИЗОВАНИХ -->
        <a sec:authorize="isAuthenticated()" class="navbar-brand" th:href="@{/home}">
            <img src="/logo.png" alt="Lazy Cent" height="50" style="height: 50px; width: auto;">
        </a>

        <!-- Логотип для НЕАВТОРИЗОВАНИХ -->
        <a sec:authorize="!isAuthenticated()" class="navbar-brand" th:href="@{/}">
            <img src="/logo.png" alt="Lazy Cent" height="50" style="height: 50px; width: auto;">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <!-- ==================== АВТОРИЗОВАНИЙ КОРИСТУВАЧ ==================== -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'home'} ? ' active'" th:href="@{/home}">
                        <i class="fas fa-home me-1"></i><span th:text="#{nav.home}">Головна</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'budget'} ? ' active'" th:href="@{/budget}">
                        <i class="fas fa-chart-line me-1"></i><span th:text="#{nav.budget}">Бюджет</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'totals'} ? ' active'" th:href="@{/totals}">
                        <i class="fas fa-chart-pie me-1"></i><span th:text="#{nav.totals}">Підсумки</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'all-days'} ? ' active'" th:href="@{/all-days}">
                        <i class="fas fa-calendar-alt me-1"></i><span th:text="#{nav.allDays}">Всі дні</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'notes'} ? ' active'" th:href="@{/notes}">
                        <i class="fas fa-sticky-note me-1"></i><span th:text="#{nav.notes}">Нотатки</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${active == 'family'} ? ' active'" th:href="@{/family}">
                        <i class="fas fa-users me-1"></i><span th:text="#{nav.family}">Сім'я</span>
                    </a>
                </li>

                <!-- Аватар та налаштування (Шестерня) -->
                <li class="nav-item ms-lg-2" sec:authorize="isAuthenticated()">
                    <button class="user-avatar" id="openSettingsBtn" type="button" th:title="#{settings.title}">
                        <span class="avatar-placeholder" sec:authentication="name"></span>
                        <span class="ms-1" sec:authentication="name"></span>
                    </button>
                </li>


                <!-- ==================== НЕАВТОРИЗОВАНИЙ КОРИСТУВАЧ ==================== -->
                <li class="nav-item mt-2 mt-lg-0" sec:authorize="!isAuthenticated()">
                    <a class="nav-btn nav-btn-ghost" th:href="@{/login}" th:text="#{nav.login}">Увійти</a>
                </li>

                <li class="nav-item mt-2 mt-lg-0 ms-lg-2" sec:authorize="!isAuthenticated()">
                    <a class="nav-btn nav-btn-primary" th:href="@{/register}" th:text="#{nav.register}">Реєстрація</a>
                </li>

                <!-- ==================== ПЕРЕМИКАЧІ (МОВА + ТЕМА) - ЛИШЕ ДЛЯ АНОНІМІВ ==================== -->
                <li class="nav-item ms-lg-3 mt-2 mt-lg-0 d-flex flex-row align-items-center justify-content-center gap-2 w-100 w-lg-auto" sec:authorize="!isAuthenticated()">
                    <!-- Мова -->
                    <div class="lang-switch flex-grow-1 flex-lg-grow-0">
                        <a th:href="@{''(lang='uk')}" th:classappend="${#locale.language == 'uk'} ? 'active'">UA</a>
                        <a th:href="@{''(lang='en')}" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
                    </div>

                    <!-- Тема -->
                    <button id="themeToggle" class="theme-toggle-btn" type="button" th:title="#{settings.theme}">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <!-- ДОДАНО СТИЛІ ДЛЯ ЦЕНТРУВАННЯ НА МОБІЛЬНИХ -->
    <style>
        @media (max-width: 991.98px) {
            /* Центруємо всі пункти меню */
            .wm-navbar .navbar-nav > li {
                display: flex;
                justify-content: center;
                width: 100%;
            }
            /* Центруємо текст і іконки всередині посилань */
            .wm-navbar .navbar-nav .nav-link {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                padding: 0.75rem 0;
            }
            /* Центруємо кнопку профілю (аватар) */
            .wm-navbar .user-avatar {
                justify-content: center;
                width: 100%;
            }
            /* Вирівнювання для блоку з мовою та темою */
            .wm-navbar .nav-item.d-flex {
                display: flex !important;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: 100%;
            }
        }
    </style>

    <script>
        (function() {
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) {
                const icon = themeBtn.querySelector('i');
                const root = document.documentElement;

                function updateIcon() {
                    const theme = root.getAttribute('data-bs-theme') || 'light';
                    icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                }

                updateIcon();

                themeBtn.addEventListener('click', function() {
                    const current = root.getAttribute('data-bs-theme') || 'light';
                    const next = current === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-bs-theme', next);
                    localStorage.setItem('lazycent-theme', next);
                    updateIcon();
                });
            }

            function setAvatarInitials() {
                const avatarPlaceholder = document.querySelector('.user-avatar .avatar-placeholder');
                if (!avatarPlaceholder) return;
                const name = avatarPlaceholder.textContent.trim();
                if (!name) return;
                const initials = name.split(' ')
                    .filter(w => w.length > 0)
                    .map(w => w.charAt(0).toUpperCase())
                    .slice(0, 2)
                    .join('');
                avatarPlaceholder.textContent = initials || 'U';
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setAvatarInitials);
            } else {
                setAvatarInitials();
            }
        })();
    </script>
</nav>

</body>
</html>
