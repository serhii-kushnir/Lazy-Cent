<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer" class="wm-footer text-center py-3 mt-5">
    <div class="container">
        <p class="mb-0" th:text="#{footer.copyright}">© 2026 Lazy Cent — Ваш фінансовий помічник</p>
        <p class="small mt-1">
            <a href="/privacy" class="text-muted text-decoration-none me-3" th:text="#{footer.privacy}">Політика конфіденціальності</a>
            <a href="/terms" class="text-muted text-decoration-none" th:text="#{footer.terms}">Умови використання</a>
        </p>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker успішно зареєстровано. Scope:', registration.scope);
                    })
                    .catch(error => {
                        console.error('Помилка реєстрації ServiceWorker:', error);
                    });
            });
        }
    </script>
</footer>

</body>
</html>
