<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="cards">
    <div th:each="budget : ${allBudgets}"
         class="col-12 col-sm-6 col-md-4 col-xl-3 day-card-wrapper"
         th:data-date="${budget.date}"
         th:data-dayname="${budget.dayName}"
         th:data-expenses="${budget.totalExpenses}"
         th:data-incomes="${budget.totalIncomes}"
         th:data-balance="${budget.remainingBalance}"
         th:data-starting="${budget.startingBalance}"
         th:data-expense-count="${budget.expenses.size()}"
         th:data-income-count="${budget.incomes.size()}"
         th:data-id="${budget.id}">
        <div class="stat-card">
            <div class="card-body">
                <div class="day-title">
                    <h6>
                        <span>
                            <i class="fas fa-calendar-day me-1"></i>
                            <span th:text="${dayNames[budget.dayName]} ?: ${budget.dayName}"></span>
                        </span>
                        <small th:text="${#temporals.format(budget.date, 'dd.MM.yyyy')}"></small>
                    </h6>
                    <div class="balance-big"
                         th:classappend="${budget.remainingBalance >= 0} ? 'text-success' : 'text-danger'"
                         th:text="${#numbers.formatDecimal(budget.remainingBalance, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></div>
                </div>

                <div class="day-row-line">
                    <span class="label">
                        <i class="fas fa-flag-checkered"></i>
                        <span th:text="#{allDays.startingBalance}">Початковий баланс</span>
                    </span>
                    <span class="value text-starting"
                          th:text="${#numbers.formatDecimal(budget.startingBalance, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></span>
                </div>
                <div class="day-row-line">
                    <span class="label text-expense">
                        <i class="fas fa-arrow-down"></i>
                        <span th:text="#{common.expense}">Витрати</span>
                    </span>
                    <span class="value text-expense"
                          th:text="${#numbers.formatDecimal(budget.totalExpenses, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></span>
                </div>
                <div class="day-row-line">
                    <span class="label text-income">
                        <i class="fas fa-arrow-up"></i>
                        <span th:text="#{common.income}">Доходи</span>
                    </span>
                    <span class="value text-income"
                          th:text="${#numbers.formatDecimal(budget.totalIncomes, 1, 'COMMA', 2, 'POINT')} + ' ' + ${currencySymbol}"></span>
                </div>
                <div class="day-row-line">
                    <span class="label">
                        <i class="fas fa-list"></i>
                        <span th:text="#{allDays.col.transactions}">Транзакцій</span>
                    </span>
                    <span class="value"
                          th:text="${budget.expenses.size() + budget.incomes.size()}"></span>
                </div>

                <div class="day-actions no-print">
                    <a th:href="'/day/' + ${budget.date}" class="btn btn-primary">
                        <i class="fas fa-eye"></i>
                        <span th:text="#{btn.view}">Переглянути</span>
                    </a>
                    <button type="button" class="btn btn-outline-danger action-delete-day"
                            th:data-id="${budget.id}"
                            th:data-date="${budget.date}"
                            th:data-dayname="${budget.dayName}"
                            th:data-expenses="${budget.totalExpenses}"
                            th:data-incomes="${budget.totalIncomes}"
                            th:data-balance="${budget.remainingBalance}"
                            th:data-starting="${budget.startingBalance}"
                            th:data-expense-count="${budget.expenses.size()}"
                            th:data-income-count="${budget.incomes.size()}"
                            th:title="#{allDays.deleteDay}">
                        <i class="fas fa-trash"></i>
                        <span th:text="#{btn.delete}">Видалити</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
