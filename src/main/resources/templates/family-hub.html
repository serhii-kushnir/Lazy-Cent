<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{family.title} + ' - ' + #{app.title}">Сім'я - Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments/head :: themeAssets(robots='noindex, nofollow')}"></div>
    <style>
        /* Анімації */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-fade-up {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        /* Стилі карток */
        .hub-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 1rem;
            height: 100%;
            text-decoration: none;
            color: inherit;
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
        }
        .hub-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            color: inherit;
        }
        .family-header {
            background: linear-gradient(135deg, #6f42c1 0%, #9b59b6 100%);
            color: #fff;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 16px rgba(111, 66, 193, 0.3);
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('family')}"></nav>
<div th:replace="~{fragments/settings-panel :: settingsPanel}"></div>
<div th:replace="~{fragments/cookie-banner :: cookieBanner}"></div>
<div th:replace="~{fragments/toast :: toastContainer}"></div>

<div class="container mt-4 mb-5">
    <!-- Заголовок сім'ї -->
    <div class="family-header anim-fade-up">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h2 class="mb-2 fw-bold"><i class="fas fa-users me-2"></i><span th:text="${family.name}">Сім'я</span></h2>
                <p class="mb-0 opacity-75">
                    <i class="fas fa-user-friends me-1"></i> <span th:text="${membersCount}">0</span> <span th:text="#{home.family.members}">учасників</span>
                    <span class="mx-2">·</span>
                    <i class="fas fa-key me-1"></i> <span th:text="#{family.hub.code}">Код:</span> <span th:text="${family.inviteCode}" class="fw-bold"></span>
                </p>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2 mt-3 mt-md-0">
                <button class="btn btn-light rounded-pill px-4" onclick="window.openSettingsDrawer('family')">
                    <i class="fas fa-cog me-1"></i> <span th:text="#{family.hub.settings}">Налаштування сім'ї</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Сітка посилань -->
    <h4 class="mb-4 text-muted fw-bold anim-fade-up delay-1">
        <i class="fas fa-compass me-2"></i><span th:text="#{family.hub.nav_title}">Навігація та дії</span>
    </h4>

    <!-- Використовуємо col-lg-2, щоб 6 карток (6 * 2 = 12) ідеально ставали в один рядок на ПК -->
    <div class="row g-3 justify-content-center">
        <!-- Home -->
        <div class="col-6 col-md-4 col-lg-2 anim-fade-up delay-2">
            <a href="/home" class="hub-card d-flex flex-column align-items-center justify-content-center p-4">
                <div class="icon-box bg-primary text-white">
                    <i class="fas fa-home"></i>
                </div>
                <h6 class="mb-0 fw-bold text-center" th:text="#{nav.home}">Головна</h6>
            </a>
        </div>

        <!-- Shared Transactions -->
        <div class="col-6 col-md-4 col-lg-2 anim-fade-up delay-2">
            <a href="/family/shared" class="hub-card d-flex flex-column align-items-center justify-content-center p-4">
                <div class="icon-box bg-secondary text-white">
                    <i class="fas fa-list-ul"></i>
                </div>
                <h6 class="mb-0 fw-bold text-center" th:text="#{family.hub.shared}">Спільні транзакції</h6>
            </a>
        </div>

        <!-- All Days -->
        <div class="col-6 col-md-4 col-lg-2 anim-fade-up delay-2">
            <a href="/all-days" class="hub-card d-flex flex-column align-items-center justify-content-center p-4">
                <div class="icon-box bg-warning text-dark">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <h6 class="mb-0 fw-bold text-center" th:text="#{nav.allDays}">Всі дні</h6>
            </a>
        </div>

        <!-- Budget -->
        <div class="col-6 col-md-4 col-lg-2 anim-fade-up delay-2">
            <a href="/budget" class="hub-card d-flex flex-column align-items-center justify-content-center p-4">
                <div class="icon-box bg-success text-white">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h6 class="mb-0 fw-bold text-center" th:text="#{nav.budget}">Бюджет</h6>
            </a>
        </div>

        <!-- Totals -->
        <div class="col-6 col-md-4 col-lg-2 anim-fade-up delay-2">
            <a href="/totals" class="hub-card d-flex flex-column align-items-center justify-content-center p-4">
                <div class="icon-box bg-info text-white">
                    <i class="fas fa-chart-pie"></i>
                </div>
                <h6 class="mb-0 fw-bold text-center" th:text="#{nav.totals}">Підсумки</h6>
            </a>
        </div>

        <!-- Notes -->
        <div class="col-6 col-md-4 col-lg-2 anim-fade-up delay-2">
            <a href="/notes" class="hub-card d-flex flex-column align-items-center justify-content-center p-4">
                <div class="icon-box bg-danger text-white">
                    <i class="fas fa-sticky-note"></i>
                </div>
                <h6 class="mb-0 fw-bold text-center" th:text="#{nav.notes}">Нотатки</h6>
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/toast :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/settings-panel :: settingsPanelScript}"></div>
</body>
</html>
