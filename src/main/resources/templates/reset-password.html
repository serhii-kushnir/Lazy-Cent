<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.reset.title} + ' – Lazy Cent'">Новий пароль – Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments :: themeAssets}"></div>
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bs-body-bg); padding: 2rem 0; }
        .auth-card { width: 100%; max-width: 480px; border-radius: 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,0.08); background: var(--bs-card-bg); padding: 2.5rem; }
        [data-bs-theme="dark"] .auth-card { box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        .auth-card h1 { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; }
        .auth-card p { color: var(--bs-secondary-color); text-align: center; }
        .auth-card .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; }
        .auth-card .form-control { border-radius: 0.75rem; padding: 0.75rem 1rem; }
        .password-toggle-group { position: relative; }
        .password-toggle-group .form-control { padding-right: 3rem; }
        .password-toggle-group .password-toggle-btn { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--bs-secondary-color); cursor: pointer; }

        .requirement-list { list-style: none; padding-left: 0; margin-top: 0.25rem; font-size: 0.85rem; }
        .requirement-list li { padding: 0.1rem 0; }
        .requirement-list li .fas { width: 1.2rem; text-align: center; }
        .requirement-list li .text-success { color: #198754; }
        .requirement-list li .text-danger { color: #dc3545; }

        .password-strength { display: flex; gap: 0.25rem; margin-top: 0.5rem; height: 4px; }
        .password-strength .bar { flex: 1; height: 100%; border-radius: 2px; background: var(--bs-border-color); transition: background 0.3s ease; }
        .password-strength .bar.active.weak { background: #dc3545; }
        .password-strength .bar.active.medium { background: #ffc107; }
        .password-strength .bar.active.strong { background: #198754; }
        .password-strength-text { font-size: 0.85rem; margin-top: 0.25rem; font-weight: 500; }
        .password-strength-text.weak { color: #dc3545; }
        .password-strength-text.medium { color: #ffc107; }
        .password-strength-text.strong { color: #198754; }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar('login')}"></nav>

<div class="auth-page">
    <div class="container">
        <div class="auth-card mx-auto">
            <h1><i class="fas fa-unlock-alt me-2"></i><span th:text="#{auth.reset.title}">Новий пароль</span></h1>
            <p th:text="#{auth.reset.subtitle}">Введіть новий пароль для вашого акаунта.</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" method="post" id="resetForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="token" th:value="${token}" />

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold" th:text="#{auth.reset.password}">Новий пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" id="password" name="password" class="form-control"
                               th:placeholder="#{auth.reset.password}" required minlength="6">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password')">
                            <i class="fas fa-eye" id="passwordIcon"></i>
                        </button>
                    </div>

                    <ul class="requirement-list" id="passwordRequirements">
                        <li id="reqLength"><i class="fas fa-circle text-danger"></i> <span th:text="#{pwd.req.length}">Мінімум 6 символів</span></li>
                        <li id="reqLowercase"><i class="fas fa-circle text-danger"></i> <span th:text="#{pwd.req.lowercase}">Мала літера (a-z)</span></li>
                        <li id="reqUppercase"><i class="fas fa-circle text-danger"></i> <span th:text="#{pwd.req.uppercase}">Велика літера (A-Z)</span></li>
                        <li id="reqDigit"><i class="fas fa-circle text-danger"></i> <span th:text="#{pwd.req.digit}">Цифра (0-9)</span></li>
                        <li id="reqSpecial"><i class="fas fa-circle text-danger"></i> <span th:text="#{pwd.req.special}">Спеціальний символ (@$!%*?&)</span></li>
                    </ul>

                    <div class="password-strength" id="passwordStrength">
                        <div class="bar" id="strengthBar1"></div>
                        <div class="bar" id="strengthBar2"></div>
                        <div class="bar" id="strengthBar3"></div>
                        <div class="bar" id="strengthBar4"></div>
                    </div>
                    <div class="password-strength-text" id="strengthText">—</div>
                </div>

                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label fw-semibold" th:text="#{auth.reset.passwordConfirm}">Підтвердіть пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-control"
                               th:placeholder="#{auth.reset.passwordConfirm}" required minlength="6">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('passwordConfirm')">
                            <i class="fas fa-eye" id="passwordConfirmIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="passwordConfirmError" th:text="#{auth.reset.mismatch}">Паролі не збігаються.</div>
                </div>

                <button type="submit" class="btn btn-primary" th:text="#{auth.reset.submit}">Змінити пароль</button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none" th:text="#{auth.forgot.back}">← Повернутися до входу</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
<div th:replace="~{fragments :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    // Функція перемикання видимості пароля (без локалізації)
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(id + 'Icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }
</script>

<script th:inline="javascript">
    (function() {
        'use strict';

        // ===== i18n для JS =====
        var i18n = {
            pwdLength:    /*[[#{pwd.req.length}]]*/    'Мінімум 6 символів',
            pwdLowercase: /*[[#{pwd.req.lowercase}]]*/ 'Мала літера (a-z)',
            pwdUppercase: /*[[#{pwd.req.uppercase}]]*/ 'Велика літера (A-Z)',
            pwdDigit:     /*[[#{pwd.req.digit}]]*/     'Цифра (0-9)',
            pwdSpecial:   /*[[#{pwd.req.special}]]*/   'Спеціальний символ (@$!%*?&)',
            levelWeak:    /*[[#{pwd.level.weak}]]*/    'Слабкий',
            levelMedium:  /*[[#{pwd.level.medium}]]*/  'Середній',
            levelStrong:  /*[[#{pwd.level.strong}]]*/  'Сильний',
            levelVeryStrong: /*[[#{pwd.level.veryStrong}]]*/ 'Дуже сильний',
            enterPassword: /*[[#{pwd.enter}]]*/        'Введіть пароль'
        };

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resetForm');
            const passwordInput = document.getElementById('password');
            const passwordConfirmInput = document.getElementById('passwordConfirm');

            const reqLength = document.getElementById('reqLength');
            const reqLowercase = document.getElementById('reqLowercase');
            const reqUppercase = document.getElementById('reqUppercase');
            const reqDigit = document.getElementById('reqDigit');
            const reqSpecial = document.getElementById('reqSpecial');

            const strengthBars = [
                document.getElementById('strengthBar1'),
                document.getElementById('strengthBar2'),
                document.getElementById('strengthBar3'),
                document.getElementById('strengthBar4')
            ];
            const strengthText = document.getElementById('strengthText');

            function applyReq(el, ok, text) {
                if (!el) return;
                el.className = ok ? 'text-success' : 'text-danger';
                el.innerHTML = (ok ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-circle"></i>') + ' ' + text;
            }

            function checkPasswordStrength(password) {
                const checks = {
                    length: password.length >= 6,
                    lowercase: /[a-z]/.test(password),
                    uppercase: /[A-Z]/.test(password),
                    digit: /\d/.test(password),
                    special: /[@$!%*?&]/.test(password)
                };

                applyReq(reqLength, checks.length, i18n.pwdLength);
                applyReq(reqLowercase, checks.lowercase, i18n.pwdLowercase);
                applyReq(reqUppercase, checks.uppercase, i18n.pwdUppercase);
                applyReq(reqDigit, checks.digit, i18n.pwdDigit);
                applyReq(reqSpecial, checks.special, i18n.pwdSpecial);

                let score = 0;
                if (checks.length) score++;
                if (checks.lowercase) score++;
                if (checks.uppercase) score++;
                if (checks.digit) score++;
                if (checks.special) score++;

                let levelText = i18n.enterPassword;
                let levelClass = '';
                let barsActive = 0;

                if (password.length === 0) {
                    levelText = i18n.enterPassword;
                    levelClass = '';
                    barsActive = 0;
                } else if (score <= 2) {
                    levelText = i18n.levelWeak;
                    levelClass = 'weak';
                    barsActive = 1;
                } else if (score <= 3) {
                    levelText = i18n.levelMedium;
                    levelClass = 'medium';
                    barsActive = 2;
                } else if (score <= 4) {
                    levelText = i18n.levelStrong;
                    levelClass = 'strong';
                    barsActive = 3;
                } else {
                    levelText = i18n.levelVeryStrong;
                    levelClass = 'strong';
                    barsActive = 4;
                }

                strengthBars.forEach((bar, index) => {
                    bar.className = 'bar';
                    if (index < barsActive) {
                        bar.classList.add('active', levelClass);
                    }
                });

                strengthText.textContent = levelText;
                strengthText.className = 'password-strength-text ' + levelClass;

                if (Object.values(checks).every(Boolean)) {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                } else {
                    passwordInput.classList.remove('is-valid');
                    passwordInput.classList.add('is-invalid');
                }

                validatePasswordMatch();
            }

            function validatePasswordMatch() {
                const match = passwordInput.value === passwordConfirmInput.value;
                if (passwordConfirmInput.value.length > 0) {
                    passwordConfirmInput.classList.toggle('is-valid', match);
                    passwordConfirmInput.classList.toggle('is-invalid', !match);
                    document.getElementById('passwordConfirmError').style.display = match ? 'none' : 'block';
                } else {
                    passwordConfirmInput.classList.remove('is-valid', 'is-invalid');
                    document.getElementById('passwordConfirmError').style.display = 'none';
                }
                return match;
            }

            passwordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
            });

            passwordConfirmInput.addEventListener('input', validatePasswordMatch);

            form.addEventListener('submit', function(e) {
                let valid = true;

                const passwordChecks = {
                    length: passwordInput.value.length >= 6,
                    lowercase: /[a-z]/.test(passwordInput.value),
                    uppercase: /[A-Z]/.test(passwordInput.value),
                    digit: /\d/.test(passwordInput.value),
                    special: /[@$!%*?&]/.test(passwordInput.value)
                };
                const isPasswordValid = Object.values(passwordChecks).every(Boolean);

                if (!isPasswordValid) {
                    passwordInput.classList.add('is-invalid');
                    valid = false;
                } else {
                    passwordInput.classList.remove('is-invalid');
                }

                if (!validatePasswordMatch()) {
                    valid = false;
                }

                if (!valid) {
                    e.preventDefault();
                    const firstError = document.querySelector('.is-invalid');
                    if (firstError) firstError.focus();
                }
            });

            if (passwordInput.value) {
                checkPasswordStrength(passwordInput.value);
            }
            if (passwordConfirmInput.value) {
                validatePasswordMatch();
            }
        });
    })();
</script>
</body>
</html>
