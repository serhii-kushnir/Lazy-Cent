<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новий пароль – Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments :: themeAssets}"></div>
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bs-body-bg); padding: 2rem 0; }
        .auth-card { width: 100%; max-width: 480px; border-radius: 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,0.08); background: var(--bs-card-bg); padding: 2.5rem; }
        [data-bs-theme="dark"] .auth-card { box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        .auth-card h1 { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; }
        .auth-card p { color: var(--bs-secondary-color); text-align: center; }
        .auth-card .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; }
        .auth-card .form-control { border-radius: 0.75rem; padding: 0.75rem 1rem; }
        .password-toggle-group { position: relative; }
        .password-toggle-group .form-control { padding-right: 3rem; }
        .password-toggle-group .password-toggle-btn { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--bs-secondary-color); cursor: pointer; }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar('login')}"></nav>

<div class="auth-page">
    <div class="container">
        <div class="auth-card mx-auto">
            <h1><i class="fas fa-unlock-alt me-2"></i>Новий пароль</h1>
            <p>Введіть новий пароль для вашого акаунта.</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="token" th:value="${token}" />

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Новий пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Новий пароль" required minlength="6">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password')"><i class="fas fa-eye" id="passwordIcon"></i></button>
                    </div>
                    <div class="form-text">Мінімум 6 символів. Рекомендуємо великі та малі літери, цифри, спецсимволи.</div>
                </div>

                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label fw-semibold">Підтвердіть пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-control" placeholder="Повторіть пароль" required minlength="6">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('passwordConfirm')"><i class="fas fa-eye" id="passwordConfirmIcon"></i></button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Змінити пароль</button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none">← Повернутися до входу</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
<div th:replace="~{fragments :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(id + 'Icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }
</script>
</body>
</html>
