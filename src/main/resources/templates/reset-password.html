<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новий пароль – Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments :: themeAssets}"></div>
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bs-body-bg); padding: 2rem 0; }
        .auth-card { width: 100%; max-width: 480px; border-radius: 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,0.08); background: var(--bs-card-bg); padding: 2.5rem; }
        [data-bs-theme="dark"] .auth-card { box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        .auth-card h1 { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; }
        .auth-card p { color: var(--bs-secondary-color); text-align: center; }
        .auth-card .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; }
        .auth-card .form-control { border-radius: 0.75rem; padding: 0.75rem 1rem; }
        .password-toggle-group { position: relative; }
        .password-toggle-group .form-control { padding-right: 3rem; }
        .password-toggle-group .password-toggle-btn { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--bs-secondary-color); cursor: pointer; }

        /* ===== Вимоги до пароля ===== */
        .requirement-list { list-style: none; padding-left: 0; margin-top: 0.25rem; font-size: 0.85rem; }
        .requirement-list li { padding: 0.1rem 0; }
        .requirement-list li .fas { width: 1.2rem; text-align: center; }
        .requirement-list li .text-success { color: #198754; }
        .requirement-list li .text-danger { color: #dc3545; }

        /* ===== Індикатор сили ===== */
        .password-strength { display: flex; gap: 0.25rem; margin-top: 0.5rem; height: 4px; }
        .password-strength .bar { flex: 1; height: 100%; border-radius: 2px; background: var(--bs-border-color); transition: background 0.3s ease; }
        .password-strength .bar.active.weak { background: #dc3545; }
        .password-strength .bar.active.medium { background: #ffc107; }
        .password-strength .bar.active.strong { background: #198754; }
        .password-strength-text { font-size: 0.85rem; margin-top: 0.25rem; font-weight: 500; }
        .password-strength-text.weak { color: #dc3545; }
        .password-strength-text.medium { color: #ffc107; }
        .password-strength-text.strong { color: #198754; }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar('login')}"></nav>

<div class="auth-page">
    <div class="container">
        <div class="auth-card mx-auto">
            <h1><i class="fas fa-unlock-alt me-2"></i>Новий пароль</h1>
            <p>Введіть новий пароль для вашого акаунта.</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" method="post" id="resetForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="token" th:value="${token}" />

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Новий пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Новий пароль" required minlength="6">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password')"><i class="fas fa-eye" id="passwordIcon"></i></button>
                    </div>

                    <!-- Вимоги до пароля -->
                    <ul class="requirement-list" id="passwordRequirements">
                        <li id="reqLength"><i class="fas fa-circle text-danger"></i> Мінімум 6 символів</li>
                        <li id="reqLowercase"><i class="fas fa-circle text-danger"></i> Мала літера (a-z)</li>
                        <li id="reqUppercase"><i class="fas fa-circle text-danger"></i> Велика літера (A-Z)</li>
                        <li id="reqDigit"><i class="fas fa-circle text-danger"></i> Цифра (0-9)</li>
                        <li id="reqSpecial"><i class="fas fa-circle text-danger"></i> Спеціальний символ (@$!%*?&)</li>
                    </ul>

                    <!-- Індикатор сили -->
                    <div class="password-strength" id="passwordStrength">
                        <div class="bar" id="strengthBar1"></div>
                        <div class="bar" id="strengthBar2"></div>
                        <div class="bar" id="strengthBar3"></div>
                        <div class="bar" id="strengthBar4"></div>
                    </div>
                    <div class="password-strength-text" id="strengthText">Введіть пароль</div>
                </div>

                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label fw-semibold">Підтвердіть пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-control" placeholder="Повторіть пароль" required minlength="6">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('passwordConfirm')"><i class="fas fa-eye" id="passwordConfirmIcon"></i></button>
                    </div>
                    <div class="invalid-feedback" id="passwordConfirmError">Паролі не збігаються.</div>
                </div>

                <button type="submit" class="btn btn-primary">Змінити пароль</button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none">← Повернутися до входу</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
<div th:replace="~{fragments :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    // Функція перемикання видимості пароля
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(id + 'Icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');

        // Елементи вимог
        const reqLength = document.getElementById('reqLength');
        const reqLowercase = document.getElementById('reqLowercase');
        const reqUppercase = document.getElementById('reqUppercase');
        const reqDigit = document.getElementById('reqDigit');
        const reqSpecial = document.getElementById('reqSpecial');

        // Елементи сили
        const strengthBars = [
            document.getElementById('strengthBar1'),
            document.getElementById('strengthBar2'),
            document.getElementById('strengthBar3'),
            document.getElementById('strengthBar4')
        ];
        const strengthText = document.getElementById('strengthText');

        // Перевірка пароля та оновлення вимог
        function checkPasswordStrength(password) {
            const checks = {
                length: password.length >= 6,
                lowercase: /[a-z]/.test(password),
                uppercase: /[A-Z]/.test(password),
                digit: /\d/.test(password),
                special: /[@$!%*?&]/.test(password)
            };

            // Оновлення списку вимог
            reqLength.className = checks.length ? 'text-success' : 'text-danger';
            reqLength.innerHTML = (checks.length ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-circle"></i>') + ' Мінімум 6 символів';

            reqLowercase.className = checks.lowercase ? 'text-success' : 'text-danger';
            reqLowercase.innerHTML = (checks.lowercase ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-circle"></i>') + ' Мала літера (a-z)';

            reqUppercase.className = checks.uppercase ? 'text-success' : 'text-danger';
            reqUppercase.innerHTML = (checks.uppercase ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-circle"></i>') + ' Велика літера (A-Z)';

            reqDigit.className = checks.digit ? 'text-success' : 'text-danger';
            reqDigit.innerHTML = (checks.digit ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-circle"></i>') + ' Цифра (0-9)';

            reqSpecial.className = checks.special ? 'text-success' : 'text-danger';
            reqSpecial.innerHTML = (checks.special ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-circle"></i>') + ' Спеціальний символ (@$!%*?&)';

            // Розрахунок сили
            let score = 0;
            if (checks.length) score++;
            if (checks.lowercase) score++;
            if (checks.uppercase) score++;
            if (checks.digit) score++;
            if (checks.special) score++;

            let level = 'weak';
            let levelText = 'Слабкий';
            let levelClass = 'weak';
            let barsActive = 0;

            if (password.length === 0) {
                level = 'none';
                levelText = 'Введіть пароль';
                levelClass = '';
                barsActive = 0;
            } else if (score <= 2) {
                level = 'weak';
                levelText = 'Слабкий';
                levelClass = 'weak';
                barsActive = 1;
            } else if (score <= 3) {
                level = 'medium';
                levelText = 'Середній';
                levelClass = 'medium';
                barsActive = 2;
            } else if (score <= 4) {
                level = 'strong';
                levelText = 'Сильний';
                levelClass = 'strong';
                barsActive = 3;
            } else {
                level = 'very-strong';
                levelText = 'Дуже сильний';
                levelClass = 'strong';
                barsActive = 4;
            }

            strengthBars.forEach((bar, index) => {
                bar.className = 'bar';
                if (index < barsActive) {
                    bar.classList.add('active', levelClass);
                }
            });

            strengthText.textContent = levelText;
            strengthText.className = 'password-strength-text ' + levelClass;

            // Валідація поля
            if (Object.values(checks).every(Boolean)) {
                passwordInput.classList.remove('is-invalid');
                passwordInput.classList.add('is-valid');
            } else {
                passwordInput.classList.remove('is-valid');
                passwordInput.classList.add('is-invalid');
            }

            validatePasswordMatch();
        }

        // Перевірка збігу паролів
        function validatePasswordMatch() {
            const match = passwordInput.value === passwordConfirmInput.value;
            if (passwordConfirmInput.value.length > 0) {
                passwordConfirmInput.classList.toggle('is-valid', match);
                passwordConfirmInput.classList.toggle('is-invalid', !match);
                document.getElementById('passwordConfirmError').style.display = match ? 'none' : 'block';
            } else {
                passwordConfirmInput.classList.remove('is-valid', 'is-invalid');
                document.getElementById('passwordConfirmError').style.display = 'none';
            }
            return match;
        }

        // Слухачі подій
        passwordInput.addEventListener('input', function() {
            checkPasswordStrength(this.value);
        });

        passwordConfirmInput.addEventListener('input', validatePasswordMatch);

        // Валідація при відправці форми
        form.addEventListener('submit', function(e) {
            let valid = true;

            // Перевірка вимог до пароля
            const passwordChecks = {
                length: passwordInput.value.length >= 6,
                lowercase: /[a-z]/.test(passwordInput.value),
                uppercase: /[A-Z]/.test(passwordInput.value),
                digit: /\d/.test(passwordInput.value),
                special: /[@$!%*?&]/.test(passwordInput.value)
            };
            const isPasswordValid = Object.values(passwordChecks).every(Boolean);

            if (!isPasswordValid) {
                passwordInput.classList.add('is-invalid');
                valid = false;
            } else {
                passwordInput.classList.remove('is-invalid');
            }

            // Перевірка збігу паролів
            if (!validatePasswordMatch()) {
                valid = false;
            }

            if (!valid) {
                e.preventDefault();
                const firstError = document.querySelector('.is-invalid');
                if (firstError) firstError.focus();
            }
        });

        // Якщо поле вже заповнене (після помилки сервера) – оновити індикатор
        if (passwordInput.value) {
            checkPasswordStrength(passwordInput.value);
        }
        if (passwordConfirmInput.value) {
            validatePasswordMatch();
        }
    });
</script>
</body>
</html>
