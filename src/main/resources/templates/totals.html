<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Підсумки — Lazy Cent</title>

    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/lib/chart.js/chart.umd.min.js"></script>

    <div th:replace="~{fragments :: themeAssets}"></div>

    <style>
        :root {
            --ink: #1B2430;
            --ink-soft: #2B3648;
            --gold: #C9A227;
            --gold-soft: #E4C766;
            --income: #4F7942;
            --expense: #B5533C;
            --text-muted: #6B7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #ffffff;
            color: var(--ink);
        }
        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .ledger-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 18px;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .ledger-head .eyebrow {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .ledger-head h1 {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            margin: 0;
            font-weight: 600;
        }
        .period-note {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .balance-row {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr;
            gap: 1px;
            background: var(--ink);
            border: 1px solid var(--ink);
            margin-bottom: 40px;
        }
        .balance-cell {
            background: #ffffff;
            padding: 26px 28px;
        }
        .balance-cell.hero { background: var(--ink); color: #ffffff; }
        .balance-cell .label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .balance-cell.hero .label { color: #9AA3B2; }
        .balance-cell .amount {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 2.1rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .balance-cell.hero .amount { color: var(--gold-soft); font-size: 2.5rem; }
        .amount.income { color: var(--income); }
        .amount.expense { color: var(--expense); }
        .panels {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 28px;
            margin-bottom: 40px;
        }
        .panel {
            background: #ffffff;
            border: 1px solid #E4DCC8;
            padding: 24px 26px 10px;
        }
        .panel h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 18px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #E4DCC8;
            color: var(--ink);
        }
        .panel canvas { max-height: 260px; }
        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .ledger-table th {
            text-align: left;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 500;
            padding: 6px 8px;
            border-bottom: 1px solid var(--ink);
        }
        .ledger-table td {
            padding: 9px 8px;
            border-bottom: 1px dotted #E4DCC8;
            font-size: 0.92rem;
        }
        .ledger-table td.num {
            font-family: 'IBM Plex Mono', monospace;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .trend-panel { grid-column: 1 / -1; }
        .empty-note {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px 0;
        }
        @media (max-width: 860px) {
            .balance-row, .panels { grid-template-columns: 1fr; }
        }
        [data-bs-theme="dark"] body {
            background-color: #14161a;
            color: #e6e6e6;
        }
        [data-bs-theme="dark"] .panel {
            background-color: #1d2027;
            border-color: #2a2e37;
        }
        [data-bs-theme="dark"] .panel h2 {
            color: #e6e6e6;
            border-bottom-color: #2a2e37;
        }
        [data-bs-theme="dark"] .balance-cell {
            background-color: #1d2027;
        }
        [data-bs-theme="dark"] .balance-cell.hero {
            background: #0d0e12;
        }
        [data-bs-theme="dark"] .ledger-table td {
            border-bottom-color: #2a2e37;
        }
        [data-bs-theme="dark"] .ledger-head {
            border-bottom-color: #2a2e37;
        }
        [data-bs-theme="dark"] .balance-row {
            background: #2a2e37;
            border-color: #2a2e37;
        }
        [data-bs-theme="dark"] .ledger-table th {
            color: #9AA3B2;
        }
        [data-bs-theme="dark"] .ledger-table td {
            color: #e6e6e6;
        }
        [data-bs-theme="dark"] .empty-note {
            color: #9AA3B2;
        }
        [data-bs-theme="dark"] .period-note {
            color: #9AA3B2;
        }
        [data-bs-theme="dark"] .ledger-head .eyebrow {
            color: #9AA3B2;
        }
        [data-bs-theme="dark"] .ledger-head h1 {
            color: #e6e6e6;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments :: navbar('totals')}"></nav>

<!-- ===== TOAST ===== -->
<div th:replace="~{fragments :: toastContainer}"></div>

<div class="wrap">

    <div class="ledger-head">
        <div>
            <div class="eyebrow">Фінансовий журнал</div>
            <h1>Підсумки</h1>
        </div>
        <div class="period-note" th:text="'Період: ' + ${startDate} + ' — ' + ${endDate}"></div>
    </div>

    <div class="balance-row">
        <div class="balance-cell hero">
            <div class="label">Чистий баланс</div>
            <div class="amount" th:text="${#numbers.formatDecimal(totalBudget.balance, 1, 'COMMA', 0, 'POINT')} + ' ₴'">0 ₴</div>
        </div>
        <div class="balance-cell">
            <div class="label">Доходи</div>
            <div class="amount income" th:text="${#numbers.formatDecimal(totalBudget.totalIncomes, 1, 'COMMA', 0, 'POINT')} + ' ₴'">0 ₴</div>
        </div>
        <div class="balance-cell">
            <div class="label">Витрати</div>
            <div class="amount expense" th:text="${#numbers.formatDecimal(totalBudget.totalExpenses, 1, 'COMMA', 0, 'POINT')} + ' ₴'">0 ₴</div>
        </div>
    </div>

    <div class="panels">
        <div class="panel">
            <h2>Витрати за категоріями</h2>
            <canvas id="categoryChart"></canvas>
        </div>
        <div class="panel">
            <h2>Розподіл сум</h2>
            <table class="ledger-table">
                <thead>
                <tr><th>Категорія</th><th style="text-align:right">Сума</th></tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${totalBudget.expensesByCategory}" th:if="${entry.value > 0}">
                    <td th:text="${entry.key.name}"></td>
                    <td class="num" th:text="${#numbers.formatDecimal(entry.value, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel trend-panel">
            <h2>Баланс по днях</h2>
            <div th:if="${totalBudget.dailySummaries.isEmpty()}" class="empty-note">
                Немає даних за обраний період. Додайте витрати чи доходи, щоб побачити тренд.
            </div>
            <canvas id="trendChart" th:unless="${totalBudget.dailySummaries.isEmpty()}"></canvas>
        </div>
    </div>

</div>

<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
<div th:replace="~{fragments :: toastScript}"></div>

<script th:inline="javascript">
    const categoryLabels = /*[[${totalBudget.expensesByCategory.keySet()}]]*/ [];
    const categoryValues = /*[[${totalBudget.expensesByCategory.values()}]]*/ [];

    const dailyDates = /*[[${totalBudget.dailySummaries.keySet()}]]*/ [];
    const dailyBalances = [];
    const dailyIncomes = [];
    const dailyExpenses = [];
    /*[# th:each="entry : ${totalBudget.dailySummaries}"]*/
    dailyBalances.push(/*[[${entry.value.balance}]]*/ 0);
    dailyIncomes.push(/*[[${entry.value.incomes}]]*/ 0);
    dailyExpenses.push(/*[[${entry.value.expenses}]]*/ 0);
    /*[/]*/

    const palette = ['#C9A227', '#B5533C', '#4F7942', '#1B2430', '#8C7A5B'];

    const readableLabels = categoryLabels.map(String);
    const nonZero = categoryValues.some(v => v > 0);

    const catCtx = document.getElementById('categoryChart');
    if (catCtx && nonZero) {
        new Chart(catCtx, {
            type: 'doughnut',
            data: {
                labels: readableLabels,
                datasets: [{
                    data: categoryValues,
                    backgroundColor: palette,
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                plugins: {
                    legend: { position: 'bottom', labels: { font: { family: 'Inter' }, boxWidth: 10 } }
                }
            }
        });
    } else if (catCtx) {
        catCtx.parentElement.innerHTML += '<div class="empty-note">Ще немає витрат для аналітики.</div>';
    }

    const trendCtx = document.getElementById('trendChart');
    if (trendCtx) {
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: dailyDates.map(String),
                datasets: [
                    {
                        label: 'Баланс',
                        data: dailyBalances,
                        borderColor: '#1B2430',
                        backgroundColor: 'rgba(27,36,48,0.08)',
                        tension: 0.25,
                        fill: true,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Доходи',
                        data: dailyIncomes,
                        borderColor: '#4F7942',
                        borderDash: [4, 3],
                        tension: 0.25,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Витрати',
                        data: dailyExpenses,
                        borderColor: '#B5533C',
                        borderDash: [4, 3],
                        tension: 0.25,
                        yAxisID: 'y'
                    }
                ]
            },
            options: {
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter' }, boxWidth: 10 } } },
                scales: { y: { ticks: { font: { family: 'IBM Plex Mono' } } }, x: { ticks: { font: { family: 'IBM Plex Mono' }, maxRotation: 0 } } }
            }
        });
    }
</script>

</body>
</html>
