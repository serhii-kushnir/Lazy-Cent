<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Підсумки - WebMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <div th:replace="~{fragments :: themeAssets}"></div>
</head>
<body>
<nav th:replace="~{fragments :: navbar('totals')}"></nav>

<div class="container mt-4">
    <h2 class="text-center mb-4"><i class="fas fa-chart-pie me-2"></i>Загальні підсумки</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-center bg-success text-white">
                <div class="card-body">
                    <h4>💰 Загальні доходи</h4>
                    <h2 th:text="${#numbers.formatDecimal(totalBudget.totalIncomes, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center bg-danger text-white">
                <div class="card-body">
                    <h4>💸 Загальні витрати</h4>
                    <h2 th:text="${#numbers.formatDecimal(totalBudget.totalExpenses, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center"
                 th:classappend="${totalBudget.balance >= 0} ? 'bg-info text-white' : 'bg-warning text-dark'">
                <div class="card-body">
                    <h4>⚖️ Чистий баланс</h4>
                    <h2 th:text="${#numbers.formatDecimal(totalBudget.balance, 1, 'COMMA', 0, 'POINT')} + ' ₴'"></h2>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
</body>
</html>
