<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Помилка - Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <div th:replace="~{fragments :: themeAssets}"></div>
</head>
<body>


<div class="container mt-5">
    <div class="alert alert-danger">
        <h4><i class="fas fa-exclamation-triangle me-2"></i>Сталася помилка!</h4>
        <p th:text="${error} ?: 'Непередбачена помилка'"></p>
        <hr>
        <a href="/" class="btn btn-primary">Повернутися на головну</a>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
</body>
</html>
