<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.generic.title} + ' - ' + #{app.title}">Помилка - Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments/head :: themeAssets}"></div>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('none')}"></nav>

<div th:replace="~{fragments/settings-panel :: settingsPanel}"></div>
<div th:replace="~{fragments/cookie-banner :: cookieBanner}"></div>
<div th:replace="~{fragments/toast :: toastContainer}"></div>

<div class="container mt-5">
    <div class="alert alert-danger">
        <h4>
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="#{error.generic.title}">Сталася помилка!</span>
        </h4>
        <p th:text="${error} ?: #{error.generic.message}">Непередбачена помилка</p>
        <hr>
        <a href="/" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>
            <span th:text="#{error.generic.home}">Повернутися на головну</span>
        </a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/head :: themeScript}"></div>
<div th:replace="~{fragments/toast :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

<div th:replace="~{fragments/settings-panel :: settingsPanelScript}"></div>

</body>
</html>
