<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід - Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments :: themeAssets}"></div>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bs-body-bg);
            padding: 2rem 0;
        }
        .auth-container {
            width: 100%;
            max-width: 640px; /* ШИРШЕ — було 560px */
            padding: 0 1.5rem;
        }
        .auth-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            background: var(--bs-card-bg);
            padding: 2.5rem 2.5rem;
        }
        [data-bs-theme="dark"] .auth-card {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }
        .auth-card .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-card .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .auth-card .auth-header p {
            color: var(--bs-secondary-color);
            font-size: 1rem;
        }
        .auth-card .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1.5px solid var(--bs-border-color);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .auth-card .form-control:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 3px rgba(var(--bs-primary-rgb), 0.15);
        }
        .auth-card .btn-primary {
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
        }
        .auth-card .btn-google {
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            border: 1.5px solid var(--bs-border-color);
            background: transparent;
            color: var(--bs-body-color);
            transition: all 0.2s ease;
        }
        .auth-card .btn-google:hover {
            background: rgba(var(--bs-primary-rgb), 0.05);
            border-color: var(--bs-primary);
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--bs-secondary-color);
            font-size: 0.85rem;
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--bs-border-color);
        }
        .auth-card .divider span {
            padding: 0 1rem;
        }
        .auth-card .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--bs-secondary-color);
        }
        .auth-card .auth-footer a {
            color: var(--bs-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-card .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Група поля з іконкою ока */
        .password-toggle-group {
            position: relative;
        }
        .password-toggle-group .form-control {
            padding-right: 3rem;
        }
        .password-toggle-group .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--bs-secondary-color);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }
        .password-toggle-group .password-toggle-btn:hover {
            color: var(--bs-primary);
        }

        @media (max-width: 576px) {
            .auth-container {
                max-width: 100%;
                padding: 0 0.75rem;
            }
            .auth-card {
                padding: 1.5rem 1.25rem;
                border-radius: 1rem;
            }
            .auth-card .auth-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments :: navbar('login')}"></nav>

<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Ласкаво просимо!</h1>
                <p>Увійдіть у свій обліковий запис Lazy Cent</p>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Ім'я користувача</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Введіть ваше ім'я" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Введіть ваш пароль" required>
                        <button type="button" class="password-toggle-btn" id="togglePassword" title="Показати/приховати пароль">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i> Невірне ім'я користувача або пароль
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    <i class="fas fa-check-circle me-2"></i> Ви вийшли з системи
                </div>
                <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

                <button type="submit" class="btn btn-primary w-100 mt-2">
                    <i class="fas fa-sign-in-alt me-2"></i>Увійти
                </button>
            </form>

            <div class="divider">
                <span>або</span>
            </div>

            <a th:href="@{/oauth2/authorization/google}" class="btn btn-google w-100">
                <i class="fab fa-google me-2"></i> Увійти через Google
            </a>

            <div class="auth-footer">
                Ще не зареєстровані? <a href="/register">Створіть акаунт</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
<div th:replace="~{fragments :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Перемикання пароля в формі входу
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        }
    });
</script>

</body>
</html>
