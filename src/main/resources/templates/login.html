<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.login.title} + ' - Lazy Cent'">Вхід - Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments/head :: themeAssets}"></div>
    <style>

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bs-body-bg);
            padding: 2rem 0;
        }
        .auth-container {
            width: 100%;
            max-width: 640px;
            padding: 0 1.5rem;
        }
        .auth-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            background: var(--bs-card-bg);
            padding: 2.5rem 2.5rem;
        }
        [data-bs-theme="dark"] .auth-card {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }
        .auth-card .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-card .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .auth-card .auth-header p {
            color: var(--bs-secondary-color);
            font-size: 1rem;
        }
        .auth-card .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1.5px solid var(--bs-border-color);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .auth-card .form-control:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 3px rgba(var(--bs-primary-rgb), 0.15);
        }
        .auth-card .btn-primary {
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
        }
        .auth-card .btn-google {
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            border: 1.5px solid #DB4437;
            background-color: #DB4437;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .auth-card .btn-google:hover {
            background-color: #C53030;
            border-color: #C53030;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(219, 68, 55, 0.3);
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--bs-secondary-color);
            font-size: 0.85rem;
        }
        .auth-card .btn-google:focus {
            box-shadow: 0 0 0 3px rgba(219, 68, 55, 0.25);
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--bs-border-color);
        }
        .auth-card .divider span {
            padding: 0 1rem;
        }
        .auth-card .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--bs-secondary-color);
        }
        .auth-card .auth-footer a {
            color: var(--bs-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-card .auth-footer a:hover {
            text-decoration: underline;
        }

        .password-toggle-group {
            position: relative;
        }
        .password-toggle-group .form-control {
            padding-right: 3rem;
        }
        .password-toggle-group .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--bs-secondary-color);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }
        .password-toggle-group .password-toggle-btn:hover {
            color: var(--bs-primary);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .auth-page {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .auth-card {
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .auth-card .mb-3 { opacity: 0; animation: fadeInUp 0.5s ease forwards; }
        .auth-card .divider { opacity: 0; animation: fadeInUp 0.5s ease forwards 0.4s; }
        .auth-card .btn-primary { opacity: 0; animation: fadeInUp 0.5s ease forwards 0.5s; }
        .auth-card .btn-google { opacity: 0; animation: fadeInUp 0.5s ease forwards 0.6s; }
        .auth-card .auth-footer { opacity: 0; animation: fadeInUp 0.5s ease forwards 0.7s; }

        .auth-card .mb-3:nth-of-type(1) { animation-delay: 0.1s; }
        .auth-card .mb-3:nth-of-type(2) { animation-delay: 0.2s; }
        .auth-card .alert { opacity: 0; animation: fadeIn 0.4s ease forwards 0.3s; }

        @media (prefers-reduced-motion: reduce) {
            .auth-page, .auth-card, .auth-card .mb-3, .auth-card .divider,
            .auth-card .btn-primary, .auth-card .btn-google, .auth-card .auth-footer, .auth-card .alert {
                animation: none;
                opacity: 1;
            }
        }

        @media (max-width: 576px) {
            .auth-container {
                max-width: 100%;
                padding: 0 0.75rem;
            }
            .auth-card {
                padding: 1.5rem 1.25rem;
                border-radius: 1rem;
            }
            .auth-card .auth-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('login')}"></nav>

<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 th:text="#{auth.login.title}">Ласкаво просимо!</h1>
                <p th:text="#{auth.login.subtitle}">Увійдіть у свій обліковий запис Lazy Cent</p>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold" th:text="#{auth.login.username}">Ім'я користувача</label>
                    <input type="text" class="form-control" id="username" name="username"
                           th:placeholder="#{auth.login.usernamePlaceholder}" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold" th:text="#{auth.login.password}">Пароль</label>
                    <div class="password-toggle-group">
                        <input type="password" class="form-control" id="password" name="password"
                               th:placeholder="#{auth.login.passwordPlaceholder}" required>
                        <button type="button" class="password-toggle-btn" id="togglePassword" th:title="#{auth.login.togglePassword}">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>
                <div th:if="${param.ratelimited}" class="alert alert-warning" role="alert">
                    <i class="fas fa-clock me-2"></i>
                    <span th:text="#{auth.login.rateLimited}">Забагато спроб входу. Спробуйте через хвилину.</span>
                </div>
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="#{auth.login.error}">Невірне ім'я користувача або пароль</span>
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="#{auth.login.logout}">Ви вийшли з системи</span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

                <button type="submit" class="btn btn-primary w-100 mt-2">
                    <i class="fas fa-sign-in-alt me-2"></i><span th:text="#{auth.login.submit}">Увійти</span>
                </button>
            </form>

            <div class="divider">
                <span th:text="#{auth.login.or}">або</span>
            </div>

            <a th:href="@{/oauth2/authorization/google}" class="btn btn-google w-100">
                <i class="fab fa-google me-2"></i> <span th:text="#{auth.login.google}">Увійти через Google</span>
            </a>

            <div class="text-center mt-3">
                <a href="/forgot-password" class="text-muted" th:text="#{auth.login.forgot}">Забули пароль?</a>
            </div>

            <div class="auth-footer">
                <span th:text="#{auth.login.noAccount}">Ще не зареєстровані?</span>
                <a href="/register" th:text="#{auth.login.register}">Створіть акаунт</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/head :: themeScript}"></div>
<div th:replace="~{fragments/toast :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        }
    });
</script>

</body>
</html>
