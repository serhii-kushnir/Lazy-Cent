<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.forgot.title} + ' – Lazy Cent'">Відновлення пароля – Lazy Cent</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <div th:replace="~{fragments/head :: themeAssets}"></div>
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bs-body-bg); padding: 2rem 0; }
        .auth-card { width: 100%; max-width: 480px; border-radius: 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,0.08); background: var(--bs-card-bg); padding: 2.5rem; }
        [data-bs-theme="dark"] .auth-card { box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        .auth-card h1 { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; }
        .auth-card p { color: var(--bs-secondary-color); text-align: center; }
        .auth-card .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; }
        .auth-card .form-control { border-radius: 0.75rem; padding: 0.75rem 1rem; }
        .back-link { text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('login')}"></nav>

<div class="auth-page">
    <div class="container">
        <div class="auth-card mx-auto">
            <h1>
                <i class="fas fa-key me-2"></i>
                <span th:text="#{auth.forgot.title}">Відновлення пароля</span>
            </h1>
            <p th:text="#{auth.forgot.subtitle}">Введіть email, і ми надішлемо посилання для відновлення пароля.</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/forgot-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{auth.forgot.email}">Email</label>
                    <input type="email" name="email" class="form-control"
                           th:placeholder="#{auth.forgot.emailPlaceholder}"
                           required>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{auth.forgot.submit}">Надіслати інструкції</button>
            </form>

            <div class="back-link">
                <a href="/login" class="text-decoration-none" th:text="#{auth.forgot.back}">← Повернутися до входу</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/toast :: toastScript}"></div>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
