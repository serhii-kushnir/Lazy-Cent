<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Налаштування - FinNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <div th:replace="~{fragments :: themeAssets}"></div>
</head>
<body>
<nav th:replace="~{fragments :: navbar('settings')}"></nav>

<!-- ===== TOAST ===== -->
<div th:replace="~{fragments :: toastContainer}"></div>

<div class="container mt-4">
    <h2><i class="fas fa-cog me-2"></i>Налаштування категорій</h2>
    <hr>

    <!-- Форма додавання категорії -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <i class="fas fa-plus-circle me-2"></i>Додати нову категорію
        </div>
        <div class="card-body">
            <form action="/categories/add" method="post">
                <div class="row">
                    <div class="col-md-5">
                        <input type="text" name="name" class="form-control" placeholder="Назва категорії" required>
                    </div>
                    <div class="col-md-4">
                        <select name="type" class="form-select" required>
                            <option value="EXPENSE">Витрата</option>
                            <option value="INCOME">Дохід</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Додати</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Список категорій витрат -->
    <div class="card mb-4">
        <div class="card-header bg-danger text-white">
            <i class="fas fa-arrow-down me-2"></i>Категорії витрат
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr><th>Назва</th><th>Дії</th></tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${expenseCategories}">
                    <td th:text="${cat.name}"></td>
                    <td>
                        <form action="/categories/delete/${cat.id}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Видалити категорію?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                        <!-- Кнопка редагування (модальне вікно) -->
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editCategoryModal"
                                data-id="${cat.id}" data-name="${cat.name}">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Список категорій доходів -->
    <div class="card">
        <div class="card-header bg-success text-white">
            <i class="fas fa-arrow-up me-2"></i>Категорії доходів
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr><th>Назва</th><th>Дії</th></tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${incomeCategories}">
                    <td th:text="${cat.name}"></td>
                    <td>
                        <form action="/categories/delete/${cat.id}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Видалити категорію?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editCategoryModal"
                                data-id="${cat.id}" data-name="${cat.name}">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальне вікно редагування категорії -->
<div class="modal fade" id="editCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редагувати категорію</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="#" th:action="@{/categories/update/{id}(id=${catId})}" method="post" id="editCategoryForm">
                <div class="modal-body">
                    <input type="text" name="name" class="form-control" id="editCategoryName" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                    <button type="submit" class="btn btn-primary">Зберегти</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Заповнення модального вікна даними категорії
    const editModal = document.getElementById('editCategoryModal');
    editModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        const form = document.getElementById('editCategoryForm');
        form.action = '/categories/update/' + id;
        document.getElementById('editCategoryName').value = name;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: themeScript}"></div>
<div th:replace="~{fragments :: toastScript}"></div>
</body>
</html>
