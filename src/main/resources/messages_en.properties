landing.hero.title.full=Lazy Cent Every penny under control
landing.features.intro=Lazy Cent is designed to make the process of managing your finances as simple and fast as possible. You don't need to learn complex instructions or spend hours setting things up. The interface is intuitive, and all the necessary features are right at your fingertips. Here are the main features that will help you achieve financial freedom. Every feature is carefully thought out to save you time and effort.
landing.screenshots.intro=The Lazy Cent interface is designed so you can manage your finances even on the go. Thanks to responsive design, all screens — from the dashboard to settings — look equally great on large monitors and smartphones. You can quickly add an expense at the store or check weekly analytics at home. Here are a few screenshots demonstrating the key features of the app.
landing.faq.intro=We have collected the most frequently asked questions from users getting to know Lazy Cent. If you haven't found the answer to your question, please contact our support team. We are always happy to help you understand the features and settings.

