# ===== PRIVACY POLICY =====
privacy.updated=Last updated: August 30, 2026
privacy.intro1=This Privacy Policy explains how Lazy Cent collects, uses, and protects your personal information when you use our website.
privacy.intro2= is a budgeting web application that helps individuals, couples, and families track expenses, manage categories, create budgets, and work together in a shared space.
privacy.intro3=If you have any questions about this Privacy Policy, please contact us at:

privacy.toc.title=Table of Contents
privacy.toc1=1. What information do we collect?
privacy.toc2=2. How do we use your information?
privacy.toc3=3. Do we share your information with third parties?
privacy.toc4=4. How do we protect your data?
privacy.toc5=5. How long do we retain your data?
privacy.toc6=6. Cookies and similar technologies
privacy.toc7=7. Your rights
privacy.toc8=8. Contact

# ===== 1 =====
privacy.s1.title=1. What information do we collect?
privacy.s1.h1=Personal information you provide to us
privacy.s1.p1=We collect personal information that you voluntarily provide to us during registration, use of the application, or communication with us. This information may include:
privacy.s1.l1.title=Username
privacy.s1.l1.text= — to identify your account.
privacy.s1.l2.title=Email
privacy.s1.l2.text= — for communication, password recovery, and notifications.
privacy.s1.l3.title=Password
privacy.s1.l3.text= — stored in encrypted form.
privacy.s1.l4.title=Financial data
privacy.s1.l4.text= — information about income, expenses, categories, budgets, and notes that you enter in the application.
privacy.s1.h2=Data collected automatically
privacy.s1.p2=When you use our Services, we may automatically collect certain technical information, such as:
privacy.s1.a1=IP address
privacy.s1.a2=Browser type and version
privacy.s1.a3=Operating system
privacy.s1.a4=Session data (for security)
privacy.s1.h3=Data from social networks (OAuth2)
privacy.s1.p3=If you sign in via Google or other OAuth2 services, we receive your name and email address (with your permission).

# ===== 2 =====
privacy.s2.title=2. How do we use your information?
privacy.s2.p1=We use the collected information for:
privacy.s2.l1.title=Providing and improving the Services
privacy.s2.l1.text= — ensuring the application works, displaying the budget, analytics, and developing new features.
privacy.s2.l2.title=Communicating with you
privacy.s2.l2.text= — sending notifications (if you subscribed), responding to your requests.
privacy.s2.l3.title=Security and fraud prevention
privacy.s2.l3.text= — protecting your account and data.
privacy.s2.l4.title=Legal compliance
privacy.s2.l4.text= — fulfilling legal obligations.
privacy.s2.hl.title=Important:
privacy.s2.hl.text= We NEVER share your financial data with third parties without your explicit consent, except as required by law.

# ===== 3 =====
privacy.s3.title=3. Do we share your information with third parties?
privacy.s3.p1=We do not sell, exchange, or share your personal information with third parties, except in the following cases:
privacy.s3.l1.title=Service providers
privacy.s3.l1.text= — we may use third-party services for hosting, data processing, or analytics (e.g., cloud providers). All such providers are required to maintain confidentiality.
privacy.s3.l2.title=Legal requirements
privacy.s3.l2.text= — if required by law or to protect our rights.

# ===== 4 =====
privacy.s4.title=4. How do we protect your data?
privacy.s4.p1=We implement modern security measures to protect your data:
privacy.s4.l1.title=Encryption
privacy.s4.l1.text= — all data is transmitted over a secure HTTPS connection, passwords are stored in encrypted form.
privacy.s4.l2.title=Restricted access
privacy.s4.l2.text= — only authorized personnel have access to the data.
privacy.s4.l3.title=Regular audits
privacy.s4.l3.text= — we conduct security audits to identify and eliminate vulnerabilities.
privacy.s4.p2=However, no method of transmission over the Internet or electronic storage is 100% secure. We do our best but cannot guarantee absolute security.

# ===== 5 =====
privacy.s5.title=5. How long do we retain your data?
privacy.s5.p1=We retain your personal data only as long as necessary for the purposes described in this Privacy Policy or as required by law.
privacy.s5.l1.title=Account data
privacy.s5.l1.text= — retained until you delete your account.
privacy.s5.l2.title=Financial data
privacy.s5.l2.text= — retained until you delete it or until the account is deleted.
privacy.s5.l3.title=Technical data
privacy.s5.l3.text= — may be retained for up to 12 months for analytics and security.
privacy.s5.p2=You can delete your data at any time through your account settings.

# ===== 6 =====
privacy.s6.title=6. Cookies and similar technologies
privacy.s6.p1=We use cookies for:
privacy.s6.l1.title=Session maintenance
privacy.s6.l1.text= — to keep you logged in.
privacy.s6.l2.title=Settings
privacy.s6.l2.text= — storing your preferences (e.g., theme).
privacy.s6.l3.title=Analytics
privacy.s6.l3.text= — to improve the Services.
privacy.s6.p2=You can manage cookies in your browser settings. Disabling cookies may affect some application features.

# ===== 7 =====
privacy.s7.title=7. Your rights
privacy.s7.p1=Depending on your location, you may have the following rights regarding your personal data:
privacy.s7.l1.title=Access
privacy.s7.l1.text= — you can view your data at any time.
privacy.s7.l2.title=Correction
privacy.s7.l2.text= — you can change or update your data.
privacy.s7.l3.title=Deletion
privacy.s7.l3.text= — you can permanently delete your account and all related data.
privacy.s7.p2=To exercise your rights, contact us at:

# ===== 8 =====
privacy.s8.title=8. Contact
