# ===== LANDING: FAQ =====
landing.faq.title=Frequently Asked Questions
landing.faq.subtitle=Got questions? We've got answers.
landing.faq.q1=Is LazyCent really free?
landing.faq.a1=Yes. LazyCent is completely free — no limits on transactions, categories, or notes. No ads, no hidden fees.
landing.faq.q2=How does daily budgeting work?
landing.faq.a2=Each day is a separate entry with its own transactions. The system automatically calculates the balance, carries it over to the next day, and shows analytics for the whole month.
landing.faq.q3=Is my financial data secure?
landing.faq.a3=Yes. Passwords are stored encrypted (BCrypt) and only the account owner has access to the data. We never share your data with third parties or use it for advertising.
landing.faq.q4=Can I use it from multiple devices?
landing.faq.a4=Yes, the app runs in your browser — access it from any device. All changes sync automatically.
landing.faq.q5=How do I delete my account?
landing.faq.a5=In your account settings there's a "Danger Zone" section. From there you can delete all data or delete your account entirely. The action can only be cancelled before confirmation.

