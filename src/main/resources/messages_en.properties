landing.cta.intro=Join thousands of users who have already changed their relationship with money. Lazy Cent will help you not only track expenses but also plan for the future. Create your account now.

# --- STEPS ---
landing.steps.intro=Getting started with Lazy Cent is very simple. You don't need to spend a lot of time on setup. Just follow a few simple steps to take control of your finances today.
landing.steps.outro=After these steps, you will get a complete picture of your finances. The system will automatically calculate the balance, and you can view detailed analytics for each day or month.

