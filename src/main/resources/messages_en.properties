landing.glossary.title=Useful financial terms
landing.glossary.sub=A short glossary for beginners
landing.glossary.term1=Budget
landing.glossary.def1=A plan of income and expenses for a specific period (e.g., a month). It helps control where the money goes.
landing.glossary.term2=Transaction
landing.glossary.def2=Any financial operation: a purchase (expense) or receiving money (income).
landing.glossary.term3=Category limit
landing.glossary.def3=The maximum amount you plan to spend on a specific category (e.g., "Food") during the month.

